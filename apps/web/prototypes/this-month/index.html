<style>
/* ============ Tokens (proposed; see TOKENS.md) ============ */
:root {
	color-scheme: light;
	--bg: #F4F5F7;
	--bg-glow-1: rgb(62 99 221 / 0.07);
	--bg-glow-2: rgb(242 162 12 / 0.05);
	--surface: #FFFFFF;
	--surface-2: #F2F4F7;
	--surface-3: #E9ECF1;
	--line: #E5E8ED;
	--line-strong: #D6DAE1;
	--text: #0E1525;
	--text-2: #545E70;
	--text-3: #8A93A4;
	--inverse: #FFFFFF;
	--accent: #3E63DD;
	--accent-soft: rgb(62 99 221 / 0.10);
	--pace: #E0940A;
	--pace-soft: rgb(224 148 10 / 0.12);
	--over: #CC3D3D;
	--over-soft: rgb(204 61 61 / 0.10);
	--scrim: rgb(14 21 37 / 0.36);
	--card-shadow: 0 1px 2px rgb(14 21 37 / 0.04), 0 1px 1px rgb(14 21 37 / 0.02);
	--pop-shadow: 0 12px 32px -8px rgb(14 21 37 / 0.22), 0 2px 6px rgb(14 21 37 / 0.06);
	--card-highlight: none;

	/* Bucket identity (icon tiles and meter fills only), assigned in order */
	--b1: #2a78d6; --b2: #e34948; --b3: #0e8fa8; --b4: #008300;
	--b5: #4a3aa7; --b6: #1baf7a; --b7: #9a5b2e; --b8: #e87ba4;

	--font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	--t-12: 0.75rem; --t-13: 0.8125rem; --t-14: 0.875rem; --t-16: 1rem;
	--t-20: 1.25rem; --t-24: 1.5rem; --t-32: 2rem; --t-44: 2.75rem;

	--s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;
	--gutter: 16px;
	--card-pad: 16px;

	--r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

	--ease: cubic-bezier(0.2, 0.8, 0.2, 1);
	--ease-spring: cubic-bezier(0.3, 1.25, 0.5, 1);
	--d-fast: 120ms; --d-base: 220ms; --d-slow: 420ms; --d-meter: 650ms;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--bg: #090C12;
		--bg-glow-1: rgb(124 155 255 / 0.10);
		--bg-glow-2: rgb(245 178 58 / 0.05);
		--surface: #10141C;
		--surface-2: #161B25;
		--surface-3: #1D2330;
		--line: #1C2230;
		--line-strong: #283041;
		--text: #ECEFF4;
		--text-2: #A0A8B7;
		--text-3: #6C7486;
		--inverse: #0B0E14;
		--accent: #7C9BFF;
		--accent-soft: rgb(124 155 255 / 0.14);
		--pace: #F5B23A;
		--pace-soft: rgb(245 178 58 / 0.14);
		--over: #F07171;
		--over-soft: rgb(240 113 113 / 0.14);
		--scrim: rgb(0 0 0 / 0.6);
		--card-shadow: 0 1px 2px rgb(0 0 0 / 0.4);
		--pop-shadow: 0 16px 40px -8px rgb(0 0 0 / 0.7), 0 0 0 1px rgb(255 255 255 / 0.04);
		--card-highlight: inset 0 1px 0 rgb(255 255 255 / 0.03);
		--b1: #3987e5; --b2: #e66767; --b3: #2aa3bd; --b4: #2f9e3a;
		--b5: #9085e9; --b6: #199e70; --b7: #c47a36; --b8: #d55181;
	}
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: #090C12;
	--bg-glow-1: rgb(124 155 255 / 0.10);
	--bg-glow-2: rgb(245 178 58 / 0.05);
	--surface: #10141C;
	--surface-2: #161B25;
	--surface-3: #1D2330;
	--line: #1C2230;
	--line-strong: #283041;
	--text: #ECEFF4;
	--text-2: #A0A8B7;
	--text-3: #6C7486;
	--inverse: #0B0E14;
	--accent: #7C9BFF;
	--accent-soft: rgb(124 155 255 / 0.14);
	--pace: #F5B23A;
	--pace-soft: rgb(245 178 58 / 0.14);
	--over: #F07171;
	--over-soft: rgb(240 113 113 / 0.14);
	--scrim: rgb(0 0 0 / 0.6);
	--card-shadow: 0 1px 2px rgb(0 0 0 / 0.4);
	--pop-shadow: 0 16px 40px -8px rgb(0 0 0 / 0.7), 0 0 0 1px rgb(255 255 255 / 0.04);
	--card-highlight: inset 0 1px 0 rgb(255 255 255 / 0.03);
	--b1: #3987e5; --b2: #e66767; --b3: #2aa3bd; --b4: #2f9e3a;
	--b5: #9085e9; --b6: #199e70; --b7: #c47a36; --b8: #d55181;
}
@media (min-width: 880px) { :root { --gutter: 40px; --card-pad: 20px; } }

/* ============ Base ============ */
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
	margin: 0;
	font-family: var(--font);
	font-size: var(--t-14);
	line-height: 1.45;
	color: var(--text);
	background:
		radial-gradient(900px 420px at 10% -120px, var(--bg-glow-1), transparent 70%),
		radial-gradient(700px 360px at 95% -160px, var(--bg-glow-2), transparent 70%),
		var(--bg);
	background-attachment: fixed;
	-webkit-font-smoothing: antialiased;
	-webkit-tap-highlight-color: transparent;
	font-feature-settings: "ss01";
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition-duration: 0ms !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { transition-duration: 0ms !important; animation: none !important; }
}

/* ============ Shared components ============ */
.card {
	background: var(--surface);
	border: 1px solid var(--line);
	border-radius: var(--r-lg);
	box-shadow: var(--card-shadow), var(--card-highlight);
}
.section { display: grid; gap: var(--s-3); }
.section-header { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 28px; }
.section-title { font-size: var(--t-14); font-weight: 600; display: inline-flex; align-items: center; gap: var(--s-2); }
.count { font-size: var(--t-12); font-weight: 600; color: var(--text-2); background: var(--surface-3); border-radius: var(--r-full); padding: 1px 7px; }
.link { border: 0; background: none; padding: 4px 0; color: var(--text-2); font-size: var(--t-13); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { color: var(--text); }
.link svg.i { width: 14px; height: 14px; }

.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
	height: 36px; padding: 0 14px; border-radius: var(--r-md);
	font-size: var(--t-14); font-weight: 550; border: 1px solid var(--line-strong); background: var(--surface);
	transition: background var(--d-fast) var(--ease), transform var(--d-fast) var(--ease), border-color var(--d-fast) var(--ease);
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--text); color: var(--inverse); border-color: transparent; }
.btn-primary:hover { background: color-mix(in oklab, var(--text) 88%, var(--accent)); }
.btn-sm { height: 30px; padding: 0 10px; font-size: var(--t-13); border-radius: var(--r-sm); }
.btn kbd { font: inherit; font-size: var(--t-12); opacity: 0.55; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 16px; }
.icon-btn {
	width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: var(--r-sm);
	border: 0; background: transparent; color: var(--text-2);
	transition: background var(--d-fast) var(--ease), color var(--d-fast) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

.pill {
	display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: var(--r-full);
	font-size: var(--t-12); font-weight: 550; white-space: nowrap;
	background: var(--surface-2); color: var(--text-2);
}
.pill svg.i { width: 12px; height: 12px; }
.pill.pace { background: var(--pace-soft); color: color-mix(in oklab, var(--pace) 75%, var(--text)); }
.pill.over { background: var(--over-soft); color: var(--over); }
.pill.dot::before { content: ""; width: 6px; height: 6px; border-radius: var(--r-full); background: currentColor; }

/* Leading tile: Bucket icon or merchant monogram */
.tile {
	width: 36px; height: 36px; border-radius: var(--r-md); display: grid; place-items: center; flex: none;
	background: color-mix(in oklab, var(--c, var(--text-3)) 13%, var(--surface));
	color: var(--c, var(--text-2));
	font-weight: 600; font-size: var(--t-14);
}
.tile.neutral { background: var(--surface-2); color: var(--text-2); }
.tile svg.i { width: 18px; height: 18px; }

/* List row: the one row used by every list */
.list { list-style: none; margin: 0; padding: 0; }
.row {
	display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; column-gap: var(--s-3); row-gap: 10px;
	align-items: center; padding: 14px var(--card-pad);
	transition: background var(--d-fast) var(--ease);
}
.list > li:not(.group-label) + li:not(.group-label) > .row { border-top: 1px solid var(--line); }
.row.interactive:hover { background: color-mix(in oklab, var(--surface-2) 60%, transparent); }
.row-main { min-width: 0; display: grid; gap: 2px; }
.row-title { font-weight: 550; font-size: var(--t-14); display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
.row-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { color: var(--text-2); font-size: var(--t-13); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row-end { text-align: end; display: grid; gap: 2px; justify-items: end; }
.row-amount { font-weight: 600; font-size: var(--t-14); font-variant-numeric: tabular-nums; }
.row-sub { color: var(--text-3); font-size: var(--t-12); font-variant-numeric: tabular-nums; }
.row-wide { grid-column: 2 / -1; }
.group-label { padding: 10px var(--card-pad) 6px; font-size: var(--t-12); font-weight: 550; color: var(--text-3); border-top: 1px solid var(--line); }
.list > .group-label:first-child { border-top: 0; }
.bucket-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--c); flex: none; }
.row.enter { animation: row-in 520ms var(--ease) both; }
@keyframes row-in { from { opacity: 0; transform: translateY(-6px); background: var(--accent-soft); } 60% { background: var(--accent-soft); } }

/* Meter: what's left of a Bucket, with the Pace tick */
.meter { position: relative; height: 6px; border-radius: var(--r-full); background: var(--surface-3); }
.meter-fill {
	position: absolute; inset-block: 0; left: 0; width: calc(var(--level) * 100%);
	border-radius: inherit; background: var(--c);
	transition: width var(--d-meter) var(--ease-spring);
}
.meter-gap {
	position: absolute; inset-block: 0; left: calc(var(--level) * 100%);
	width: calc(max(0, var(--pace-at) - var(--level)) * 100%);
	background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--pace) 70%, transparent) 0 1.5px, transparent 1.5px 4px);
	border-radius: 0 var(--r-full) var(--r-full) 0;
	transition: left var(--d-meter) var(--ease-spring), width var(--d-meter) var(--ease-spring);
}
.meter-tick {
	position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; left: calc(var(--pace-at) * 100%);
	border-radius: 2px; background: var(--pace);
	box-shadow: 0 0 0 2px var(--surface);
	transition: left var(--d-base) var(--ease);
}
.is-over .meter { background: var(--over-soft); }
.is-over .meter-gap { display: none; }

/* ============ Shell ============ */
.app { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
.sidebar { display: none; }
.content { width: 100%; max-width: 1200px; margin-inline: auto; padding: var(--s-4) var(--gutter) calc(120px + env(safe-area-inset-bottom, 0px)); }

.page-header { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); margin-block: var(--s-2) var(--s-6); }
.page-title { display: flex; align-items: center; gap: var(--s-1); }
.page-title h1 { font-size: var(--t-24); font-weight: 650; letter-spacing: -0.025em; padding-inline: 2px; }
.page-title .eyebrow { display: block; font-size: var(--t-13); color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.page-actions { display: flex; align-items: center; gap: var(--s-3); }
.avatars { display: flex; }
.avatar {
	width: 28px; height: 28px; border-radius: var(--r-full); display: grid; place-items: center;
	font-size: 11px; font-weight: 650; color: var(--text); background: var(--surface-3);
	box-shadow: 0 0 0 2px var(--bg);
}
.avatar + .avatar { margin-inline-start: -6px; }
.header-add { display: none; }

.tabbar {
	position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
	display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
	padding: 6px var(--s-2) calc(6px + env(safe-area-inset-bottom, 0px));
	background: color-mix(in oklab, var(--surface) 82%, transparent);
	backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px);
	border-top: 1px solid var(--line);
}
.tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0; border: 0; background: none; color: var(--text-3); font-size: 10.5px; font-weight: 550; }
.tab svg.i { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--text); }
.tab-add {
	justify-self: center; width: 48px; height: 40px; border-radius: 14px; border: 0;
	background: var(--text); color: var(--inverse); display: grid; place-items: center;
	transition: transform var(--d-fast) var(--ease);
}
.tab-add:active { transform: scale(0.94); }
.tab-add svg.i { width: 22px; height: 22px; stroke-width: 2.2; }

@media (min-width: 880px) {
	.app { grid-template-columns: 248px minmax(0, 1fr); }
	.tabbar { display: none; }
	.header-add { display: inline-flex; }
	.sidebar {
		display: flex; flex-direction: column; gap: var(--s-6);
		position: sticky; top: 0; height: 100vh; padding: var(--s-5) var(--s-3);
		border-inline-end: 1px solid var(--line);
		background: color-mix(in oklab, var(--surface) 55%, transparent);
	}
	.content { padding-block: var(--s-6) var(--s-12); }
	.page-header { margin-block: 0 var(--s-8); }
	.page-title h1 { font-size: var(--t-32); }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px var(--s-3); font-weight: 650; font-size: var(--t-16); letter-spacing: -0.02em; }
.brand-mark {
	width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
	background: var(--text); color: var(--inverse);
}
.brand-mark svg { width: 14px; height: 14px; }
.nav { display: grid; gap: 2px; }
.nav-label { padding: 0 var(--s-3) 6px; font-size: var(--t-12); color: var(--text-3); font-weight: 550; }
.nav-link {
	display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r-sm);
	border: 0; background: none; color: var(--text-2); font-weight: 500; font-size: var(--t-14); text-align: start;
	transition: background var(--d-fast) var(--ease), color var(--d-fast) var(--ease);
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line), var(--card-shadow); }
.nav-link .count { margin-inline-start: auto; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-md); }
.side-foot .who { display: grid; font-size: var(--t-13); line-height: 1.3; }
.side-foot .who span { color: var(--text-3); font-size: var(--t-12); }

/* ============ This Month layout ============ */
.layout { display: grid; gap: var(--s-8); }
.main-col, .rail { display: grid; gap: var(--s-8); align-content: start; min-width: 0; }
@media (min-width: 1100px) {
	.layout { grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s-8); align-items: start; }
	.rail { position: sticky; top: var(--s-6); }
}

/* Hero: Free to Spend + month chart */
.hero { overflow: hidden; }
.hero-top { padding: var(--card-pad); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s-4); }
.hero-label { font-size: var(--t-13); font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.hero-value { font-size: var(--t-44); font-weight: 650; letter-spacing: -0.04em; line-height: 1.05; margin-block: 6px 4px; }
.hero-value .cents { color: var(--text-3); font-size: 0.5em; letter-spacing: -0.01em; vertical-align: 0.72em; margin-inline-start: 2px; }
.hero-sub { color: var(--text-2); font-size: var(--t-14); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.stat { padding: 14px var(--card-pad); display: grid; gap: 2px; }
.stat + .stat { border-inline-start: 1px solid var(--line); }
.stat-label { font-size: var(--t-12); color: var(--text-2); font-weight: 500; }
.stat-value { font-size: var(--t-16); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.chart-wrap { position: relative; padding: 0 var(--card-pad) var(--s-2); }
.chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-2); padding: var(--s-4) var(--card-pad) var(--s-2); border-top: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-4); font-size: var(--t-12); color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-line { width: 14px; height: 2px; border-radius: 2px; background: var(--text); }
.lg-dash { width: 14px; height: 0; border-top: 2px dashed var(--text-3); }
.lg-dot { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--pace); box-shadow: 0 0 0 3px var(--pace-soft); }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .axis { fill: var(--text-3); font-size: 11px; font-family: var(--font); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .plan { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .pace-path { stroke: var(--text-3); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.chart .spent-path { stroke: var(--text); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .spent-area { fill: url(#spent-grad); }
.chart .today-line { stroke: var(--pace); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.7; }
.chart .today-dot { fill: var(--pace); stroke: var(--surface); stroke-width: 2.5; }
.chart .today-halo { fill: var(--pace); opacity: 0.25; transform-box: fill-box; transform-origin: center; animation: halo 2.4s var(--ease) infinite; }
@keyframes halo { 0% { transform: scale(0.6); opacity: 0.35; } 70%, 100% { transform: scale(2.2); opacity: 0; } }
.chart .hover-line { stroke: var(--text-3); stroke-width: 1; }
.chart .hover-dot { fill: var(--surface); stroke: var(--text); stroke-width: 2; }
.tooltip {
	position: absolute; top: 0; pointer-events: none; transform: translate(-50%, -4px);
	background: var(--text); color: var(--inverse); border-radius: var(--r-sm); padding: 6px 9px;
	font-size: var(--t-12); line-height: 1.35; white-space: nowrap; box-shadow: var(--pop-shadow);
	opacity: 0; transition: opacity var(--d-fast) var(--ease);
}
.tooltip.show { opacity: 1; }
.tooltip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tooltip span { opacity: 0.7; }

/* Plan summary */
.alloc { display: flex; height: 8px; gap: 2px; margin: var(--card-pad) var(--card-pad) 6px; }
.alloc span { border-radius: 3px; min-width: 4px; }
.plan-rows { padding: 6px 0 var(--s-2); }
.plan-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: 7px var(--card-pad); font-size: var(--t-14); color: var(--text-2); }
.plan-row .k { display: inline-flex; align-items: center; gap: var(--s-2); }
.plan-row .sw { width: 8px; height: 8px; border-radius: 2px; }
.plan-row .num { color: var(--text); font-weight: 550; }
.plan-row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; color: var(--text); font-weight: 600; }
.plan-row.total .num { font-weight: 650; }

.empty-note { padding: var(--card-pad); display: flex; gap: var(--s-3); align-items: center; color: var(--text-2); }
.empty-note .tile { --c: var(--b6); }

/* ============ Quick Add ============ */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity var(--d-slow) var(--ease); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.sheet {
	position: fixed; z-index: 41; inset-inline: 0; bottom: 0;
	max-height: calc(100% - 16px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
	background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0;
	border: 1px solid var(--line); border-bottom: 0; box-shadow: var(--pop-shadow);
	padding: var(--s-2) var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom, 0px));
	transform: translateY(100%); transition: transform var(--d-slow) var(--ease);
	display: grid; gap: var(--s-4);
}
.sheet:focus { outline: none; }
.sheet-open .scrim { opacity: 1; }
.sheet-open .sheet { transform: none; }
.grabber { width: 36px; height: 5px; border-radius: var(--r-full); background: var(--surface-3); justify-self: center; }
.sheet .section-header h2 { font-size: var(--t-16); font-weight: 600; }
.amount-display { text-align: center; padding-block: var(--s-2) 0; }
.amount { font-size: 3.25rem; font-weight: 600; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; display: inline-flex; align-items: flex-start; }
.amount .cur { font-size: 0.5em; color: var(--text-3); margin: 0.2em 2px 0 0; letter-spacing: 0; }
.amount.empty { color: var(--text-3); }
.amount .caret { width: 2px; align-self: stretch; margin-inline-start: 3px; background: var(--accent); border-radius: 2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.amount.shake { animation: shake 260ms var(--ease); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.amount-hint { font-size: var(--t-13); color: var(--text-3); margin-top: 6px; min-height: 1.4em; }
.seg { display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: var(--r-md); overflow-x: auto; scrollbar-width: none; }
.seg button {
	flex: 1 0 auto; height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent;
	color: var(--text-2); font-size: var(--t-13); font-weight: 550;
	transition: background var(--d-fast) var(--ease), color var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 0 0 1px var(--line); }
.field-label { font-size: var(--t-12); font-weight: 550; color: var(--text-2); margin-bottom: var(--s-2); }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
.pick {
	display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 10px; align-items: center; text-align: start;
	padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface);
	transition: border-color var(--d-fast) var(--ease), background var(--d-fast) var(--ease), transform var(--d-fast) var(--ease), opacity var(--d-base) var(--ease);
}
.pick .tile { width: 32px; height: 32px; border-radius: 10px; grid-row: span 2; }
.pick .pn { font-weight: 550; font-size: var(--t-13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .pl { font-size: var(--t-12); color: var(--text-3); font-variant-numeric: tabular-nums; }
.pick:hover:not([aria-disabled="true"]) { border-color: color-mix(in oklab, var(--c) 45%, var(--line)); background: color-mix(in oklab, var(--c) 5%, var(--surface)); }
.pick:active:not([aria-disabled="true"]) { transform: scale(0.98); }
.pick[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.note-input {
	width: 100%; height: 38px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2);
	padding: 0 12px; font-size: var(--t-14); color: var(--text); outline: none;
	transition: border-color var(--d-fast) var(--ease), background var(--d-fast) var(--ease);
}
.note-input:focus { border-color: var(--accent); background: var(--surface); }
.note-input::placeholder { color: var(--text-3); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.key {
	height: 52px; border: 0; border-radius: var(--r-md); background: transparent;
	font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums;
	transition: background var(--d-fast) var(--ease), transform var(--d-fast) var(--ease);
}
.key:hover { background: var(--surface-2); }
.key:active { background: var(--surface-3); transform: scale(0.96); }
.key svg.i { width: 22px; height: 22px; }
@media (min-width: 880px) {
	.sheet {
		inset: auto; left: 50%; top: 50%; width: 440px; border-radius: var(--r-xl); border-bottom: 1px solid var(--line);
		padding: var(--s-5); transform: translate(-50%, -47%) scale(0.98); opacity: 0;
		transition: transform var(--d-slow) var(--ease), opacity var(--d-base) var(--ease);
	}
	.sheet-open .sheet { transform: translate(-50%, -50%); opacity: 1; }
	.grabber, .keypad { display: none; }
}

/* ============ Toast ============ */
.toast {
	position: fixed; z-index: 50; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
	transform: translate(-50%, 10px) scale(0.98); opacity: 0; pointer-events: none;
	display: flex; align-items: center; gap: var(--s-3); max-width: calc(100% - 32px); width: max-content;
	padding: 8px 8px 8px 12px; border-radius: var(--r-md);
	background: var(--text); color: var(--inverse); box-shadow: var(--pop-shadow);
	font-size: var(--t-14); font-weight: 500;
	transition: transform var(--d-base) var(--ease), opacity var(--d-base) var(--ease);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast .t-icon { width: 20px; height: 20px; border-radius: var(--r-full); display: grid; place-items: center; background: color-mix(in oklab, var(--inverse) 16%, transparent); }
.toast .t-icon svg.i { width: 12px; height: 12px; stroke-width: 2.5; }
.toast button { border: 0; height: 28px; padding: 0 10px; border-radius: 7px; background: color-mix(in oklab, var(--inverse) 14%, transparent); color: var(--inverse); font-weight: 600; font-size: var(--t-13); }
@media (min-width: 880px) { .toast { bottom: 28px; left: calc(50% + 124px); } }

/* ============ Prototype controls (not part of the design) ============ */
.proto { position: fixed; z-index: 60; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); font-family: system-ui, sans-serif; font-size: 12px; }
@media (min-width: 880px) { .proto { bottom: 16px; right: 16px; } }
.sheet-open .proto { display: none; }
.proto-toggle { border: 1.5px dashed #d946ef; background: #111; color: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 600; }
.proto-panel { position: absolute; right: 0; bottom: calc(100% + 8px); width: 260px; background: #111; color: #fff; border-radius: 12px; padding: 12px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.4); border: 1.5px dashed #d946ef; }
.proto-panel label { display: grid; gap: 4px; color: #bbb; }
.proto-panel .opts { display: flex; gap: 4px; }
.proto-panel .opts button { flex: 1; border: 0; border-radius: 6px; padding: 5px 0; background: #262626; color: #fff; }
.proto-panel .opts button[aria-pressed="true"] { background: #d946ef; color: #000; font-weight: 700; }
.proto-panel input[type="range"] { width: 100%; accent-color: #d946ef; }
</style>

		<div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 17V9.5a3 3 0 0 1 6 0V14a3 3 0 0 0 6 0V7"/></svg></span>Noodle</div>
		<button class="btn btn-primary" type="button" data-open-add><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Quick Add<kbd>Q</kbd></button>
		<nav class="nav" id="side-nav"></nav>

			<span class="avatars"><span class="avatar">A</span><span class="avatar">S</span></span>

			<div class="page-title">

				<button class="icon-btn" type="button" data-soon="Other months" aria-label="Next month"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>

				<span class="avatars" aria-label="Alex and Sam"><span class="avatar">A</span><span class="avatar">S</span></span>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="proto" id="proto"></div>

<script>
(() => {
	// ============ Fake Household (in memory) ============
	const DAYS = 30, MON = "Sep";
	const baseline = 1020000, commitments = 566000, goals = 90000;
	const ICON = {
		cart: '<circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.3a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.2"/>',
		fork: '<path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 0-4 2.5-4 6v4h4"/>',
		hockey: '<path d="M15 3 9.6 16.4a2 2 0 0 1-1.9 1.3H3.5v2.8h4.9a3 3 0 0 0 2.8-2L18 3"/><rect x="15" y="17.5" width="6" height="3" rx="1.2"/>',
		home: '<path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/>',
		school: '<path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3V11M21.5 9v5"/>',
		ticket: '<path d="M3.5 8.5v-2A1.5 1.5 0 0 1 5 5h14a1.5 1.5 0 0 1 1.5 1.5v2a2.5 2.5 0 0 0 0 5v2A1.5 1.5 0 0 1 19 17H5a1.5 1.5 0 0 1-1.5-1.5v-2a2.5 2.5 0 0 0 0-5z"/><path d="M14.5 5.5v1.5M14.5 10.25v1.5M14.5 15v1.5"/>',
		person: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/>',
		lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
		plus: '<path d="M12 5v14M5 12h14"/>',
		x: '<path d="M18 6 6 18M6 6l12 12"/>',
		check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
		alert: '<path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/>',
		arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
		back: '<path d="M21 5H9l-6 7 6 7h12z"/><path d="m17 9-6 6M11 9l6 6"/>',
		month: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
		list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/>',
		review: '<path d="M4 13.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7.5M4 13.5h4.5l1.5 2.5h4l1.5-2.5H20M4 13.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4.5"/>',
		goal: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/>',
		explore: '<path d="M3 20h18M6 16l4-5 3.5 3L19 7"/>',
		plan: '<path d="M4 6h16M4 12h10M4 18h6"/>',
	};
	const icon = (name, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;

	const buckets = [
		{ id: "groceries", name: "Groceries", slot: 1, icon: "cart", kind: "Fresh-start", allowance: 110000, rollover: 0, spent: 61200 },
		{ id: "eating", name: "Eating out", slot: 2, icon: "fork", kind: "Fresh-start", allowance: 30000, rollover: 0, spent: 11800 },
		{ id: "hockey", name: "Hockey", slot: 3, icon: "hockey", kind: "Rolling", allowance: 30000, rollover: 8500, spent: 24000 },
		{ id: "life", name: "Life", slot: 4, icon: "home", kind: "Fresh-start", allowance: 40000, rollover: 0, spent: 16000 },
		{ id: "kids", name: "School & kids", slot: 5, icon: "school", kind: "Fresh-start", allowance: 15000, rollover: 0, spent: 4100 },
		{ id: "fun", name: "Fun", slot: 6, icon: "ticket", kind: "Fresh-start", allowance: 25000, rollover: 0, spent: 26200 },
		{ id: "alex", name: "Alex’s allowance", slot: 7, icon: "person", kind: "Personal", allowance: 10000, rollover: 0, spent: 3500 },
		{ id: "sam", name: "Sam’s allowance", slot: 8, icon: "person", kind: "Personal", allowance: 10000, rollover: 0, spent: 4800, private: true },
	];
	const likely = ["groceries", "eating", "hockey", "fun", "life", "kids", "alex"];
	const people = [{ id: "all", name: "Everyone" }, { id: "maya", name: "Maya" }, { id: "leo", name: "Leo" }, { id: "alex", name: "Alex" }, { id: "sam", name: "Sam" }];
	let txns = [
		{ id: 1, merchant: "Costco", bucket: "groceries", for: "all", amount: 18642, day: 13, auto: true },
		{ id: 2, merchant: "Pizza Nova", bucket: "eating", for: "all", amount: 3850, day: 13 },
		{ id: 3, merchant: "Pro Hockey Life", bucket: "hockey", for: "leo", amount: 6499, day: 12, auto: true },
		{ id: 4, merchant: "Target", bucket: "life", for: "all", amount: 5217, day: 11, auto: true },
		{ id: 5, merchant: "Regal Cinemas", bucket: "fun", for: "maya", amount: 4100, day: 10 },
		{ id: 6, merchant: "Trader Joe’s", bucket: "groceries", for: "all", amount: 9388, day: 9, auto: true },
	];
	let nextId = 100;

	// ============ Prototype state ============
	const load = (k, d) => { try { return localStorage.getItem("noodle-proto2-" + k) ?? d; } catch { return d; } };
	const save = (k, v) => { try { localStorage.setItem("noodle-proto2-" + k, v); } catch {} };
	const S = { day: Number(load("day", "14")), theme: load("theme", "system"), motion: load("motion", "on"), failNext: false, protoOpen: false, sheet: null, enterTxn: null };

	// ============ Money + month-state (the real version lives in `domain`) ============
	const money = (c, cents = false) => {
		const s = (Math.abs(c) / 100).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
		return c < 0 ? "−" + s : s;
	};
	const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
	const byId = (id) => buckets.find((b) => b.id === id);
	function stateOf(b) {
		const avail = b.allowance + b.rollover, left = avail - b.spent;
		const pace = 1 - S.day / DAYS; // share that should still be left after today
		const gap = pace * avail - left;
		let status = "on";
		if (left < 0) status = "over";
		else if (gap > avail * 0.03) status = "ahead";
		return { avail, left, level: Math.max(0, Math.min(1, left / avail)), pace, gap, status };
	}
	const totals = () => {
		const avail = buckets.reduce((s, b) => s + b.allowance + b.rollover, 0);
		const spent = buckets.reduce((s, b) => s + b.spent, 0);
		const left = buckets.reduce((s, b) => s + Math.max(0, stateOf(b).left), 0);
		return { avail, spent, left };
	};
	const freeToSpend = () => baseline - commitments - goals - buckets.reduce((s, b) => s + b.allowance, 0);
	const daysLeft = () => DAYS - S.day;

	// ============ Pieces ============
	let prevLevels = {}, prevNums = {};
	const vars = (b, st) => `--c: var(--b${b.slot}); --level: ${prevLevels[b.id] ?? st.level}; --pace-at: ${st.pace};`;
	const tw = (key, cents, fmt = "whole") => `<span class="num" data-tw="${key}" data-v="${cents}" data-f="${fmt}">${fmtBy(fmt, prevNums[key] ?? cents)}</span>`;
	function fmtBy(f, v) { return f === "cents" ? money(v, true) : money(Math.round(v)); }

	function statusPill(st) {
		if (st.status === "over") return `<span class="pill over dot">Over by ${money(-st.left)}</span>`;
		if (st.status === "ahead") return `<span class="pill pace dot">Ahead of Pace</span>`;
		return "";
	}
	const meter = () => `<div class="meter" aria-hidden="true"><div class="meter-fill"></div><div class="meter-gap"></div><div class="meter-tick"></div></div>`;

	function hero() {
		const t = totals();
		const free = freeToSpend();
		const perDay = daysLeft() > 0 ? t.left / daysLeft() : t.left;
		return `<section class="card hero" aria-label="Free to Spend">
			<div class="hero-top">
				<div>
					<div class="hero-label">Free to Spend</div>
					<div class="hero-value">${tw("free", free)}</div>
					<p class="hero-sub">Not planned yet · yours until ${MON}&nbsp;${DAYS}</p>
				</div>
			</div>
			<div class="stats">
				<div class="stat"><span class="stat-label">Left in Buckets</span><span class="stat-value">${tw("left", t.left)}</span></div>
				<div class="stat"><span class="stat-label">Per day</span><span class="stat-value">${tw("perday", perDay)}</span></div>
				<div class="stat"><span class="stat-label">Days left</span><span class="stat-value num">${daysLeft()}</span></div>
			</div>
			<div class="chart-head">
				<span class="section-title">Bucket spending</span>
				<div class="legend"><span><i class="lg-line"></i>Spent</span><span><i class="lg-dash"></i>Pace</span><span><i class="lg-dot"></i>Today</span></div>
			</div>
			<div class="chart-wrap"><div class="chart" id="chart"></div><div class="tooltip" id="tooltip"></div></div>
		</section>`;
	}

	function needsLook() {
		const items = buckets.map((b) => ({ b, st: stateOf(b) })).filter(({ st }) => st.status !== "on")
			.sort((x, y) => (y.st.status === "over") - (x.st.status === "over") || y.st.gap / y.st.avail - x.st.gap / x.st.avail);
		const header = `<div class="section-header"><h2 class="section-title">Needs a look${items.length ? ` <span class="count">${items.length}</span>` : ""}</h2></div>`;
		if (!items.length) return `<section class="section">${header}<div class="card empty-note"><span class="tile">${icon("check")}</span><div><div class="row-title">Everything’s on Pace</div><div class="row-meta">Nothing needs you until the weekly Check-in.</div></div></div></section>`;
		const runsOut = (b, st) => {
			const perDay = b.spent / Math.max(S.day, 1);
			const d = perDay > 0 ? Math.floor(S.day + st.left / perDay) : DAYS;
			return d < DAYS ? `at this rate, runs out ${MON} ${Math.max(d, S.day)}` : "should last the month";
		};
		return `<section class="section">${header}<ul class="card list">${items.map(({ b, st }) => `
			<li><div class="row interactive ${st.status === "over" ? "is-over" : ""}" style="${vars(b, st)}">
				<span class="tile">${icon(b.icon)}</span>
				<div class="row-main">
					<div class="row-title"><span>${esc(b.name)}</span></div>
					<div class="row-meta">${st.status === "over" ? `${money(-st.left)} over its ${money(st.avail)}` : `${money(st.gap)} ahead of Pace · ${runsOut(b, st)}`}</div>
				</div>
				${st.status === "over"
					? `<button class="btn btn-sm" type="button" data-soon="Cover">Cover</button>`
					: `<button class="btn btn-sm" type="button" data-soon="Bucket detail">Review</button>`}
			</div></li>`).join("")}</ul></section>`;
	}

	function bucketList() {
		return `<section class="section">
			<div class="section-header"><h2 class="section-title">Buckets</h2><button class="link" type="button" data-soon="Edit Plan">Edit Plan ${icon("arrow")}</button></div>
			<ul class="card list">${buckets.map((b) => {
				const st = stateOf(b);
				return `<li><div class="row interactive ${st.status === "over" ? "is-over" : ""}" data-bid="${b.id}" style="${vars(b, st)}"
					aria-label="${esc(`${b.name}: ${money(Math.max(0, st.left))} left of ${money(st.avail)}`)}">
					<span class="tile">${icon(b.icon)}</span>
					<div class="row-main">
						<div class="row-title"><span>${esc(b.name)}</span>${statusPill(st)}</div>
						<div class="row-meta">${b.kind}${b.rollover ? ` · ${money(b.rollover)} rolled over` : ""}${b.private ? ` · <span class="pill">${icon("lock")}Private</span>` : ""}</div>
					</div>
					<div class="row-end"><span class="row-amount">${tw("b-" + b.id, Math.max(0, st.left))}</span><span class="row-sub">of ${money(st.avail)}</span></div>
					<div class="row-wide">${meter()}</div>
				</div></li>`;
			}).join("")}</ul>
		</section>`;
	}

	function recent() {
		const dayLabel = (d) => d === S.day ? "Today" : d === S.day - 1 ? "Yesterday" : `${MON} ${d}`;
		const shown = txns.slice(0, 6);
		let html = "", last = null;
		for (const t of shown) {
			if (t.day !== last) { html += `<li class="group-label">${dayLabel(t.day)}</li>`; last = t.day; }
			const b = byId(t.bucket), who = people.find((p) => p.id === t.for)?.name ?? "Everyone";
			html += `<li><div class="row interactive ${t.id === S.enterTxn ? "enter" : ""}" style="--c: var(--b${b.slot})">
				<span class="tile neutral">${esc(t.merchant.replace(/^[^A-Za-z]*/, "").charAt(0) || "·")}</span>
				<div class="row-main">
					<div class="row-title"><span>${esc(t.merchant)}</span></div>
					<div class="row-meta"><i class="bucket-dot"></i>${esc(b.name)} · ${esc(who)}${t.auto ? ` · <span class="pill" title="Filed automatically. Tap to change.">Auto</span>` : ""}</div>
				</div>
				<div class="row-end"><span class="row-amount">${money(t.amount, true)}</span></div>
			</div></li>`;
		}
		return `<section class="section">
			<div class="section-header"><h2 class="section-title">Recent</h2><button class="link" type="button" data-soon="Transactions">See all ${icon("arrow")}</button></div>
			<ul class="card list">${html}</ul>
		</section>`;
	}

	function planSummary() {
		const bk = buckets.reduce((s, b) => s + b.allowance, 0), free = freeToSpend();
		const parts = [["Commitments", commitments, "var(--text-3)"], ["Buckets", bk, "var(--text-2)"], ["Goals", goals, "var(--accent)"], ["Free to Spend", free, "var(--pace)"]];
		return `<section class="section">
			<div class="section-header"><h2 class="section-title">September Plan</h2><button class="link" type="button" data-soon="Plan">Open ${icon("arrow")}</button></div>
			<div class="card">
				<div class="alloc" aria-hidden="true">${parts.map(([, v, c]) => `<span style="flex: ${v}; background: ${c}"></span>`).join("")}</div>
				<div class="plan-rows">
					<div class="plan-row"><span class="k">Baseline</span><span class="num">${money(baseline)}</span></div>
					${parts.slice(0, 3).map(([k, v, c]) => `<div class="plan-row"><span class="k"><i class="sw" style="background:${c}"></i>${k}</span><span class="num">−${money(v)}</span></div>`).join("")}
					<div class="plan-row total"><span class="k"><i class="sw" style="background: var(--pace)"></i>Free to Spend</span><span class="num">${money(free)}</span></div>
				</div>
			</div>
		</section>`;
	}

	// ============ Chart: cumulative Bucket spending vs Pace ============
	// Deterministic daily weights (weekends heavier), scaled so today's total matches.
	const weights = Array.from({ length: DAYS + 1 }, (_, d) => d === 0 ? 0 : 0.55 + ((d * 37) % 11) / 12 + ((d % 7 === 5 || d % 7 === 6) ? 0.9 : 0));
	function series() {
		const t = totals();
		const upTo = weights.slice(0, S.day + 1);
		const w = upTo.reduce((a, b) => a + b, 0) || 1;
		let acc = 0;
		return upTo.map((x) => (acc += x, t.spent * acc / w));
	}
	function drawChart() {
		const host = document.getElementById("chart");
		if (!host) return;
		const W = Math.max(280, host.clientWidth), H = W < 520 ? 150 : 190;
		const pad = { l: 0, r: 0, t: 18, b: 22 };
		const t = totals(), data = series();
		const yMax = Math.max(t.avail, t.spent) * 1.08;
		const x = (d) => pad.l + (d / DAYS) * (W - pad.l - pad.r);
		const y = (v) => pad.t + (1 - v / yMax) * (H - pad.t - pad.b);
		const pts = data.map((v, d) => [x(d), y(v)]);
		const line = pts.map(([a, b], i) => `${i ? "L" : "M"}${a.toFixed(1)},${b.toFixed(1)}`).join("");
		const area = `${line}L${x(S.day).toFixed(1)},${y(0)}L${x(0)},${y(0)}Z`;
		const [tx, ty] = pts[pts.length - 1];
		const ticks = [1, 8, 15, 22, 30];
		host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`${money(t.spent)} spent from Buckets by ${MON} ${S.day}; Pace expects ${money(t.avail * S.day / DAYS)}.`)}">
			<defs><linearGradient id="spent-grad" x1="0" x2="0" y1="0" y2="1">
				<stop offset="0" stop-color="var(--text)" stop-opacity="0.12"/><stop offset="1" stop-color="var(--text)" stop-opacity="0"/>
			</linearGradient></defs>
			<line class="grid" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>
			<line class="plan" x1="0" x2="${W}" y1="${y(t.avail)}" y2="${y(t.avail)}"/>
			<text class="axis" x="${W}" y="${y(t.avail) - 6}" text-anchor="end">Planned ${money(t.avail)}</text>
			<path class="pace-path" d="M${x(0)},${y(0)}L${x(DAYS)},${y(t.avail)}"/>
			<path class="spent-area" d="${area}"/>
			<path class="spent-path" d="${line}"/>
			<line class="today-line" x1="${tx}" x2="${tx}" y1="${pad.t}" y2="${y(0)}"/>
			<circle class="today-halo" cx="${tx}" cy="${ty}" r="6"/>
			<circle class="today-dot" cx="${tx}" cy="${ty}" r="4.5"/>
			${ticks.map((d) => `<text class="axis" x="${x(d)}" y="${H - 4}" text-anchor="${d === 1 ? "start" : d === DAYS ? "end" : "middle"}">${MON} ${d}</text>`).join("")}
			<g id="hover" style="display:none"><line class="hover-line" y1="${pad.t}" y2="${y(0)}"/><circle class="hover-dot" r="4"/></g>
			<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit"/>
		</svg>`;
		const hit = host.querySelector("#hit"), hov = host.querySelector("#hover"), tip = document.getElementById("tooltip");
		const show = (ev) => {
			const r = host.getBoundingClientRect();
			const d = Math.max(1, Math.min(S.day, Math.round(((ev.clientX - r.left) / W) * DAYS)));
			const [hx, hy] = pts[d];
			hov.style.display = "";
			hov.querySelector("line").setAttribute("x1", hx); hov.querySelector("line").setAttribute("x2", hx);
			hov.querySelector("circle").setAttribute("cx", hx); hov.querySelector("circle").setAttribute("cy", hy);
			tip.innerHTML = `<span>${MON} ${d}</span><br><b>${money(data[d])}</b> spent · <span>Pace ${money(t.avail * d / DAYS)}</span>`;
			tip.style.left = `${host.offsetLeft + Math.min(Math.max(hx, 80), W - 80)}px`;
			tip.classList.add("show");
		};
		hit.addEventListener("pointermove", show);
		hit.addEventListener("pointerdown", show);
		hit.addEventListener("pointerleave", () => { hov.style.display = "none"; tip.classList.remove("show"); });
	}
	new ResizeObserver(() => drawChart()).observe(document.getElementById("view"));

	// ============ Render ============
	const view = document.getElementById("view");
	const reduced = () => S.motion === "reduced" || matchMedia("(prefers-reduced-motion: reduce)").matches;
	function render() {
		view.innerHTML = `<div class="layout">
			<div class="main-col">${hero()}${needsLook()}${bucketList()}</div>
			<div class="rail">${recent()}${planSummary()}</div>
		</div>`;
		drawChart();
		// Meters and numbers render at their previous values, then move to the new ones.
		requestAnimationFrame(() => requestAnimationFrame(() => {
			for (const el of view.querySelectorAll("[data-bid]")) el.style.setProperty("--level", stateOf(byId(el.dataset.bid)).level);
			for (const el of view.querySelectorAll("[data-tw]")) tween(el);
		}));
		prevLevels = Object.fromEntries(buckets.map((b) => [b.id, stateOf(b).level]));
		S.enterTxn = null;
	}
	function tween(el) {
		const key = el.dataset.tw, to = Number(el.dataset.v), from = prevNums[key] ?? to;
		prevNums[key] = to;
		if (from === to || reduced()) { el.textContent = fmtBy(el.dataset.f, to); return; }
		const start = performance.now(), dur = 600;
		const step = (now) => {
			const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
			el.textContent = fmtBy(el.dataset.f, from + (to - from) * e);
			if (p < 1) requestAnimationFrame(step);
		};
		requestAnimationFrame(step);
	}

	// ============ Navigation ============
	document.getElementById("side-nav").innerHTML = `<div class="nav-label">Household</div>` + [
		["This Month", "month", true], ["Transactions", "list"], ["Review", "review", false, 3], ["Plan", "plan"], ["Goals", "goal"], ["Explore", "explore"],
	].map(([n, ic, cur, c]) => `<button class="nav-link" type="button" ${cur ? 'aria-current="page"' : `data-soon="${n}"`}>${icon(ic)}${n}${c ? `<span class="count">${c}</span>` : ""}</button>`).join("");
	document.getElementById("tabbar").innerHTML = `
		<button class="tab" type="button" aria-current="page">${icon("month")}Month</button>
		<button class="tab" type="button" data-soon="Transactions">${icon("list")}Activity</button>
		<button class="tab-add" type="button" data-open-add aria-label="Quick Add">${icon("plus")}</button>
		<button class="tab" type="button" data-soon="Review">${icon("review")}Review</button>
		<button class="tab" type="button" data-soon="Plan">${icon("plan")}Plan</button>`;

	// ============ Toast ============
	const toastEl = document.getElementById("toast");
	let toastTimer;
	function toast(text, { action, kind = "info" } = {}) {
		clearTimeout(toastTimer);
		toastEl.innerHTML = `<span class="t-icon">${icon(kind === "error" ? "alert" : "check")}</span><span>${esc(text)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ""}`;
		if (action) toastEl.querySelector("button").onclick = () => { toastEl.classList.remove("show"); action.run(); };
		toastEl.classList.add("show");
		toastTimer = setTimeout(() => toastEl.classList.remove("show"), action ? 6000 : 2400);
	}

	// ============ Quick Add ============
	const sheetRoot = document.getElementById("sheet-root");
	let opener = null;
	const cents = (a) => Math.round(Number(a || "0") * 100);
	function openSheet() {
		if (S.sheet) return;
		opener = document.activeElement;
		S.sheet = { amount: "", for: "all", note: "" };
		sheetRoot.innerHTML = `<div class="scrim" data-close></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="qa-title" tabindex="-1"></div>`;
		renderSheet();
		requestAnimationFrame(() => requestAnimationFrame(() => { document.body.classList.add("sheet-open"); document.getElementById("sheet").focus(); }));
	}
	function closeSheet() {
		if (!S.sheet) return;
		S.sheet = null;
		document.body.classList.remove("sheet-open");
		setTimeout(() => { if (!S.sheet) sheetRoot.innerHTML = ""; }, 420);
		opener?.focus?.();
	}
	function amountHtml(a) {
		if (!a) return `<div class="amount empty" id="qa-amount"><span class="cur">$</span>0<span class="caret"></span></div>`;
		const [w, f] = a.split(".");
		return `<div class="amount" id="qa-amount"><span class="cur">$</span>${Number(w || "0").toLocaleString("en-US")}${f !== undefined ? `.${f}` : ""}<span class="caret"></span></div>`;
	}
	function renderSheet() {
		const sh = S.sheet, el = document.getElementById("sheet");
		if (!sh || !el) return;
		const has = cents(sh.amount) > 0;
		el.innerHTML = `
			<div class="grabber" aria-hidden="true"></div>
			<div class="section-header"><h2 id="qa-title">Quick Add</h2><button class="icon-btn" type="button" data-close aria-label="Close">${icon("x")}</button></div>
			<div class="amount-display">${amountHtml(sh.amount)}<div class="amount-hint" id="qa-hint">${has ? "Tap a Bucket to add it" : "Type an amount"}</div></div>
			<div>
				<div class="field-label">Add to</div>
				<div class="picks" id="qa-picks">${likely.map((id) => {
					const b = byId(id), st = stateOf(b);
					return `<button class="pick" type="button" data-pick="${id}" style="--c: var(--b${b.slot})" aria-disabled="${!has}">
						<span class="tile">${icon(b.icon)}</span><span class="pn">${esc(b.name)}</span><span class="pl">${money(Math.max(0, st.left))} left</span>
					</button>`;
				}).join("")}</div>
			</div>
			<div>
				<div class="field-label">For</div>
				<div class="seg" role="group" aria-label="For">${people.map((p) => `<button type="button" data-for="${p.id}" aria-pressed="${sh.for === p.id}">${p.name}</button>`).join("")}</div>
			</div>
			<input class="note-input" id="qa-note" placeholder="Add a note (optional)" value="${esc(sh.note)}" maxlength="80" autocomplete="off">
			<div class="keypad" role="group" aria-label="Amount">
				${["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0"].map((k) => `<button class="key" type="button" data-key="${k}">${k}</button>`).join("")}
				<button class="key" type="button" data-key="back" aria-label="Delete">${icon("back")}</button>
			</div>`;
	}
	function updateAmount() {
		const has = cents(S.sheet.amount) > 0;
		document.getElementById("qa-amount").outerHTML = amountHtml(S.sheet.amount);
		document.getElementById("qa-hint").textContent = has ? "Tap a Bucket to add it" : "Type an amount";
		for (const p of document.querySelectorAll("#qa-picks .pick")) p.setAttribute("aria-disabled", String(!has));
	}
	function pressKey(k) {
		let a = S.sheet.amount;
		if (k === "back") a = a.slice(0, -1);
		else if (k === ".") { if (a.includes(".")) return shake(); a = (a || "0") + "."; }
		else {
			const [w, f] = a.split(".");
			if ((f !== undefined && f.length >= 2) || (f === undefined && (w || "").length >= 5)) return shake();
			a = a === "0" ? k : a + k;
		}
		S.sheet.amount = a;
		updateAmount();
	}
	function shake() {
		const el = document.getElementById("qa-amount");
		el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
	}
	function commit(bucketId) {
		const sh = S.sheet, amount = cents(sh.amount);
		if (!amount) { shake(); return; }
		const note = document.getElementById("qa-note").value.trim();
		const b = byId(bucketId);
		const t = { id: nextId++, merchant: note || "Quick Add", bucket: bucketId, for: sh.for, amount, day: S.day };
		const fail = S.failNext;
		S.failNext = false;
		closeSheet();
		const apply = () => { b.spent += amount; txns = [t, ...txns]; S.enterTxn = t.id; render(); };
		const undo = () => { b.spent -= amount; txns = txns.filter((x) => x.id !== t.id); render(); };
		setTimeout(() => {
			apply(); // optimistic
			if (fail) setTimeout(() => {
				undo();
				toast(`Couldn’t save ${money(amount, true)} to ${b.name}`, { kind: "error", action: { label: "Retry", run: () => { apply(); toast(`${money(amount, true)} added to ${b.name}`); } } });
			}, 1100);
			else toast(`${money(amount, true)} added to ${b.name}`, { action: { label: "Undo", run: undo } });
		}, 260);
	}
	sheetRoot.addEventListener("click", (e) => {
		const t = e.target.closest("button, [data-close]");
		if (!t) return;
		if (t.matches("[data-close]")) return closeSheet();
		if (t.dataset.key) return pressKey(t.dataset.key);
		if (t.dataset.for) {
			S.sheet.for = t.dataset.for;
			for (const b of t.parentElement.children) b.setAttribute("aria-pressed", String(b === t));
			return;
		}
		if (t.dataset.pick) return commit(t.dataset.pick);
	});
	let dragY = null;
	sheetRoot.addEventListener("touchstart", (e) => { const s = e.target.closest(".sheet"); if (s && s.scrollTop <= 0 && !e.target.closest(".seg")) dragY = e.touches[0].clientY; }, { passive: true });
	sheetRoot.addEventListener("touchmove", (e) => {
		if (dragY === null) return;
		const dy = e.touches[0].clientY - dragY, s = document.getElementById("sheet");
		if (dy > 0 && s) { s.style.transition = "none"; s.style.transform = `translateY(${dy}px)`; }
	}, { passive: true });
	sheetRoot.addEventListener("touchend", (e) => {
		if (dragY === null) return;
		const dy = e.changedTouches[0].clientY - dragY, s = document.getElementById("sheet");
		dragY = null;
		if (!s) return;
		s.style.transition = ""; s.style.transform = "";
		if (dy > 90) closeSheet();
	});

	document.addEventListener("click", (e) => {
		const t = e.target.closest("[data-open-add], [data-soon]");
		if (!t) return;
		if (t.matches("[data-open-add]")) return openSheet();
		toast(`${t.dataset.soon} isn’t in this prototype`);
	});
	document.addEventListener("keydown", (e) => {
		const typing = e.target.closest?.("input, textarea, [contenteditable]");
		if (S.sheet) {
			if (e.key === "Escape") { e.preventDefault(); return closeSheet(); }
			if (typing) return;
			if (/^[0-9.]$/.test(e.key)) { e.preventDefault(); return pressKey(e.key); }
			if (e.key === "Backspace") { e.preventDefault(); return pressKey("back"); }
			return;
		}
		if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "q" || e.key === "Q")) { e.preventDefault(); openSheet(); }
	});

	// ============ Prototype controls ============
	const protoEl = document.getElementById("proto");
	function applyTheme() {
		if (S.theme === "system") document.documentElement.removeAttribute("data-theme");
		else document.documentElement.setAttribute("data-theme", S.theme);
		document.documentElement.classList.toggle("reduce-motion", S.motion === "reduced");
	}
	function renderProto() {
		const opt = (attr, cur, vals) => `<div class="opts">${vals.map(([v, l]) => `<button type="button" ${attr}="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;
		protoEl.innerHTML = `<button class="proto-toggle" type="button" data-p="toggle" aria-expanded="${S.protoOpen}">Prototype · ${MON} ${S.day}</button>
			${S.protoOpen ? `<div class="proto-panel">
				<label>Day of month: ${MON} ${S.day}<input type="range" id="p-day" min="1" max="${DAYS}" value="${S.day}"></label>
				<label>Theme${opt("data-theme-set", S.theme, [["system", "System"], ["light", "Light"], ["dark", "Dark"]])}</label>
				<label>Motion${opt("data-motion-set", S.motion, [["on", "On"], ["reduced", "Reduced"]])}</label>
				<label>Next Quick Add${opt("data-fail-set", String(S.failNext), [["false", "Saves"], ["true", "Fails"]])}</label>
			</div>` : ""}`;
	}
	protoEl.addEventListener("click", (e) => {
		const t = e.target.closest("button");
		if (!t) return;
		if (t.dataset.p === "toggle") S.protoOpen = !S.protoOpen;
		else if (t.dataset.themeSet) { S.theme = t.dataset.themeSet; save("theme", S.theme); applyTheme(); drawChart(); }
		else if (t.dataset.motionSet) { S.motion = t.dataset.motionSet; save("motion", S.motion); applyTheme(); }
		else if (t.dataset.failSet) S.failNext = t.dataset.failSet === "true";
		renderProto();
	});
	protoEl.addEventListener("input", (e) => {
		if (e.target.id !== "p-day") return;
		S.day = Number(e.target.value);
		save("day", String(S.day));
		prevLevels = {}; prevNums = {};
		render();
		protoEl.querySelector(".proto-toggle").textContent = `Prototype · ${MON} ${S.day}`;
		e.target.previousSibling.textContent = `Day of month: ${MON} ${S.day}`;
	});

	applyTheme();
	renderProto();
	render();
})();
</script>
