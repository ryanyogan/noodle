<style>
/* ---------- Proposed tokens (see TOKENS.md) ---------- */
:root {
	color-scheme: light;
	/* Named colours */
	--ice: #EDF2F7;
	--board: #FFFFFF;
	--ink: #15213A;
	--slate: #5A6A82;
	--marigold: #F2A20C;

	/* Roles */
	--bg: var(--ice);
	--surface: var(--board);
	--surface-sunk: #E3EAF2;
	--line: #D3DCE7;
	--text: var(--ink);
	--text-2: var(--slate);
	--pace: var(--marigold);
	--scrim: rgb(21 33 58 / 0.42);
	--focus: #2a78d6;
	--glass: rgb(21 33 58 / 0.05);
	--shadow-1: 0 1px 2px rgb(21 33 58 / 0.06), 0 2px 8px rgb(21 33 58 / 0.05);
	--shadow-2: 0 8px 32px rgb(21 33 58 / 0.18);

	/* Bucket categorical set, in assignment order (validated: adjacent CVD ΔE ≥ 13.7 light) */
	--b1: #2a78d6; /* blue */
	--b2: #e34948; /* red */
	--b3: #0e8fa8; /* cyan */
	--b4: #008300; /* green */
	--b5: #4a3aa7; /* violet */
	--b6: #1baf7a; /* aqua */
	--b7: #9a5b2e; /* brown */
	--b8: #e87ba4; /* magenta */

	/* Type */
	--font-num: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	--font-ui: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
	--t-xs: 0.75rem;   /* 12 */
	--t-sm: 0.875rem;  /* 14 */
	--t-md: 1rem;      /* 16 */
	--t-lg: 1.25rem;   /* 20 */
	--t-xl: 1.625rem;  /* 26 */
	--t-2xl: 2.25rem;  /* 36 */
	--t-3xl: 3.25rem;  /* 52 */

	/* Space (4pt) */
	--s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

	/* Radii */
	--r-sm: 8px;    /* chips, keys */
	--r-md: 14px;   /* cards */
	--r-lg: 22px;   /* sheets */
	--r-vessel: 18px;
	--r-full: 999px;

	/* Motion */
	--ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
	--ease-spring: cubic-bezier(0.34, 1.5, 0.64, 1);
	--dur-fast: 140ms;
	--dur-base: 240ms;
	--dur-sheet: 340ms;
	--dur-level: 760ms;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--bg: #0D1525;
		--surface: #16213A;
		--surface-sunk: #111A2E;
		--line: #26344F;
		--text: #E8EEF7;
		--text-2: #97A6BD;
		--scrim: rgb(3 7 15 / 0.62);
		--focus: #6da7ec;
		--glass: rgb(232 238 247 / 0.05);
		--shadow-1: 0 1px 2px rgb(0 0 0 / 0.3);
		--shadow-2: 0 12px 40px rgb(0 0 0 / 0.5);
		--b1: #3987e5; --b2: #e66767; --b3: #2aa3bd; --b4: #2f9e3a;
		--b5: #9085e9; --b6: #199e70; --b7: #c47a36; --b8: #d55181;
	}
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: #0D1525;
	--surface: #16213A;
	--surface-sunk: #111A2E;
	--line: #26344F;
	--text: #E8EEF7;
	--text-2: #97A6BD;
	--scrim: rgb(3 7 15 / 0.62);
	--focus: #6da7ec;
	--glass: rgb(232 238 247 / 0.05);
	--shadow-1: 0 1px 2px rgb(0 0 0 / 0.3);
	--shadow-2: 0 12px 40px rgb(0 0 0 / 0.5);
	--b1: #3987e5; --b2: #e66767; --b3: #2aa3bd; --b4: #2f9e3a;
	--b5: #9085e9; --b6: #199e70; --b7: #c47a36; --b8: #d55181;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
	margin: 0;
	background: var(--bg);
	color: var(--text);
	font-family: var(--font-ui);
	font-size: var(--t-md);
	line-height: 1.45;
	-webkit-font-smoothing: antialiased;
	-webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition-duration: 0ms !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { transition-duration: 0ms !important; animation: none !important; }
}

/* ---------- Shell ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.sidebar { display: none; }
.content {
	width: 100%;
	max-width: 1120px;
	margin-inline: auto;
	padding-inline: var(--s-4);
	padding-block: var(--s-4) calc(150px + env(safe-area-inset-bottom, 0px));
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-block-end: var(--s-5); }
.month-switch { display: flex; align-items: center; gap: var(--s-1); }
.month-switch h1 { font-size: var(--t-lg); font-weight: 650; letter-spacing: -0.01em; padding-inline: var(--s-1); }
.icon-btn {
	width: 36px; height: 36px; display: grid; place-items: center;
	border: 0; background: transparent; border-radius: var(--r-full); cursor: pointer; color: var(--text-2);
}
.icon-btn:hover { background: var(--glass); color: var(--text); }
.parents { display: flex; align-items: center; gap: var(--s-2); color: var(--text-2); font-size: var(--t-sm); }
.avatars { display: flex; }
.avatar {
	width: 28px; height: 28px; border-radius: var(--r-full); display: grid; place-items: center;
	font-size: var(--t-xs); font-weight: 700; color: var(--bg); background: var(--text);
	box-shadow: 0 0 0 2px var(--bg);
}
.avatar + .avatar { margin-inline-start: -6px; background: var(--text-2); }
.brand-mobile { font-family: var(--font-num); font-weight: 750; font-size: var(--t-lg); letter-spacing: -0.02em; }

.tabbar {
	position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
	display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
	padding: var(--s-2) var(--s-2) calc(var(--s-2) + env(safe-area-inset-bottom, 0px));
	background: color-mix(in oklab, var(--surface) 88%, transparent);
	backdrop-filter: saturate(1.4) blur(16px);
	-webkit-backdrop-filter: saturate(1.4) blur(16px);
	border-top: 1px solid var(--line);
}
.tab {
	display: grid; justify-items: center; gap: 2px; padding-block: var(--s-1);
	border: 0; background: none; cursor: pointer; color: var(--text-2); font-size: 11px; font-weight: 600;
}
.tab[aria-current="page"] { color: var(--text); }
.tab svg { width: 24px; height: 24px; }
.tab-add {
	justify-self: center; width: 56px; height: 56px; margin-block-start: -22px; border-radius: var(--r-full);
	border: 0; cursor: pointer; background: var(--text); color: var(--bg); display: grid; place-items: center;
	box-shadow: var(--shadow-2);
	transition: transform var(--dur-fast) var(--ease-out);
}
.tab-add:active { transform: scale(0.94); }
.tab-add svg { width: 26px; height: 26px; }
.badge {
	min-width: 16px; height: 16px; padding-inline: 4px; border-radius: var(--r-full);
	background: var(--text); color: var(--bg); font-size: 10px; font-weight: 700; display: inline-grid; place-items: center;
}

@media (min-width: 880px) {
	.app { grid-template-columns: 232px 1fr; }
	.tabbar, .brand-mobile { display: none; }
	.sidebar {
		display: flex; flex-direction: column; gap: var(--s-5);
		position: sticky; top: 0; height: 100vh;
		padding: var(--s-5) var(--s-4);
		border-inline-end: 1px solid var(--line);
		background: var(--surface);
	}
	.brand { font-family: var(--font-num); font-weight: 750; font-size: var(--t-xl); letter-spacing: -0.03em; padding-inline: var(--s-3); }
	.side-nav { display: grid; gap: 2px; }
	.side-link {
		display: flex; align-items: center; gap: var(--s-3); padding: 9px var(--s-3); border-radius: var(--r-sm);
		border: 0; background: none; cursor: pointer; color: var(--text-2); font-weight: 600; font-size: var(--t-sm); text-align: start;
	}
	.side-link svg { width: 20px; height: 20px; }
	.side-link:hover { background: var(--glass); color: var(--text); }
	.side-link[aria-current="page"] { background: var(--surface-sunk); color: var(--text); }
	.side-link .badge { margin-inline-start: auto; }
	.side-add {
		display: flex; align-items: center; justify-content: center; gap: var(--s-2);
		padding: 11px var(--s-4); border-radius: var(--r-md); border: 0; cursor: pointer;
		background: var(--text); color: var(--bg); font-weight: 700;
	}
	.side-add kbd { font: inherit; font-size: var(--t-xs); opacity: 0.6; }
	.side-foot { margin-block-start: auto; color: var(--text-2); font-size: var(--t-sm); padding-inline: var(--s-3); }
	.content { padding-inline: var(--s-7); padding-block: var(--s-6) var(--s-8); }
}

/* ---------- Free to Spend sentence ---------- */
.sentence { font-size: var(--t-xl); line-height: 1.2; font-weight: 500; letter-spacing: -0.015em; max-width: 22ch; }
.sentence .num { font-weight: 750; }
.sub { color: var(--text-2); font-size: var(--t-sm); margin-block-start: var(--s-2); }
.legend { display: inline-flex; align-items: center; gap: var(--s-2); color: var(--text-2); font-size: var(--t-xs); }
.legend i { width: 16px; height: 2px; background: var(--pace); border-radius: 2px; }
.section-title { font-size: var(--t-sm); font-weight: 700; color: var(--text-2); margin-block-end: var(--s-3); }

/* ---------- Vertical vessel ---------- */
.jar {
	position: relative; overflow: hidden;
	background: var(--surface-sunk);
	border-radius: var(--r-vessel) var(--r-vessel) calc(var(--r-vessel) + 6px) calc(var(--r-vessel) + 6px);
	box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--c) 28%, transparent);
}
.liquid {
	position: absolute; inset-inline: 0; bottom: 0;
	height: calc(var(--level) * 100%);
	background: var(--c);
	transition: height var(--dur-level) var(--ease-spring);
}
.liquid::before {
	content: ""; position: absolute; inset-inline: 0; top: 0; height: 4px;
	background: color-mix(in oklab, var(--c) 60%, white);
	opacity: 0.55;
}
/* Ahead of Pace: the hatched gap between the level and where Pace says it should be. */
.gap {
	position: absolute; inset-inline: 0;
	bottom: calc(var(--level) * 100%);
	height: calc(max(0, var(--pace-at) - var(--level)) * 100%);
	background: repeating-linear-gradient(135deg, color-mix(in oklab, var(--pace) 55%, transparent) 0 2px, transparent 2px 7px);
	transition: bottom var(--dur-level) var(--ease-spring), height var(--dur-level) var(--ease-spring);
}
.pace-line {
	position: absolute; inset-inline: 0; height: 2px;
	bottom: calc(var(--pace-at) * 100% - 1px);
	background: var(--pace);
	box-shadow: 0 0 0 1px color-mix(in oklab, var(--surface) 70%, transparent);
	transition: bottom var(--dur-base) var(--ease-out);
}
.is-over .jar { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-2); }
.is-over .jar::after {
	content: ""; position: absolute; inset: 6px; border-radius: inherit;
	border: 1.5px dashed color-mix(in oklab, var(--text-2) 60%, transparent);
}

/* ---------- Horizontal tube ---------- */
.tube {
	position: relative; height: 22px; border-radius: var(--r-full); overflow: hidden;
	background: var(--surface-sunk);
	box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--c) 28%, transparent);
}
.tube .liquid { inset-block: 0; inset-inline: 0 auto; height: auto; width: calc(var(--level) * 100%); transition: width var(--dur-level) var(--ease-spring); border-radius: inherit; }
.tube .liquid::before { inset-block: 0; inset-inline: auto 0; top: 0; width: 4px; height: auto; }
.tube .gap {
	inset-block: 0; bottom: 0; height: auto;
	left: calc(var(--level) * 100%);
	width: calc(max(0, var(--pace-at) - var(--level)) * 100%);
	transition: left var(--dur-level) var(--ease-spring), width var(--dur-level) var(--ease-spring);
}
.tube .pace-line { inset-block: -2px; bottom: -2px; height: auto; width: 2px; left: calc(var(--pace-at) * 100% - 1px); transition: left var(--dur-base) var(--ease-out); }
.is-over .tube { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-2); }

.status { font-size: var(--t-xs); color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: var(--r-full); background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-2); }
.status.ahead::before { background: var(--pace); box-shadow: none; }
.status.over::before { background: var(--text); box-shadow: none; }
.private { font-size: var(--t-xs); color: var(--text-2); display: inline-flex; gap: 4px; align-items: center; }
.private svg { width: 12px; height: 12px; }

/* ---------- Variant A: Shelf ---------- */
.shelf-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--s-4); margin-block-end: var(--s-6); }
.shelf {
	display: grid; gap: var(--s-5) var(--s-4);
	grid-template-columns: repeat(3, minmax(0, 1fr));
	margin-block-end: var(--s-7);
}
@media (min-width: 640px) { .shelf { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1180px) { .shelf { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.shelf .vessel { display: grid; gap: 6px; align-content: start; }
.shelf .jar { height: 150px; }
@media (min-width: 880px) { .shelf .jar { height: 196px; } }
.v-name { font-weight: 650; font-size: var(--t-sm); line-height: 1.2; overflow-wrap: anywhere; }
.v-left { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--t-lg); font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.v-of { color: var(--text-2); font-size: var(--t-xs); }
.a-grid { display: grid; gap: var(--s-6); }
@media (min-width: 880px) { .a-grid { grid-template-columns: 1.6fr 1fr; align-items: start; } }

/* ---------- Transactions ---------- */
.txns { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); }
.txn { display: grid; grid-template-columns: 10px 1fr auto; gap: var(--s-1) var(--s-3); align-items: center; padding: var(--s-3) var(--s-4); }
.txn + .txn { border-top: 1px solid var(--line); }
.txn .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.txn-main { min-width: 0; }
.txn-merchant { font-weight: 600; font-size: var(--t-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-meta { color: var(--text-2); font-size: var(--t-xs); }
.txn-amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 650; font-size: var(--t-md); }
.auto { border: 1px solid var(--line); border-radius: var(--r-full); padding: 0 6px; font-size: 11px; color: var(--text-2); }
.txn.fresh { animation: txn-in 600ms var(--ease-out); }
@keyframes txn-in { from { background: color-mix(in oklab, var(--pace) 18%, transparent); } }

.plan-card { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); padding: var(--s-4); display: grid; gap: var(--s-2); }
.plan-row { display: flex; justify-content: space-between; gap: var(--s-3); font-size: var(--t-sm); color: var(--text-2); }
.plan-row .num { color: var(--text); font-weight: 600; }
.plan-row.total { border-top: 1px solid var(--line); padding-block-start: var(--s-2); color: var(--text); font-weight: 650; }

/* ---------- Variant B: Ledger ---------- */
.b-grid { display: grid; gap: var(--s-6); }
@media (min-width: 880px) { .b-grid { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } }
.b-hero { display: grid; gap: var(--s-1); margin-block-end: var(--s-5); }
.b-hero .big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--t-3xl); font-weight: 750; line-height: 1; letter-spacing: -0.04em; }
.b-hero .caption { color: var(--text-2); font-size: var(--t-md); }
.ledger { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name amt" "tube tube" "status kind"; gap: var(--s-2) var(--s-3); padding: var(--s-4); }
.row + .row { border-top: 1px solid var(--line); }
.row .r-name { grid-area: name; display: flex; align-items: center; gap: var(--s-2); font-weight: 650; min-width: 0; }
.row .r-name .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.row .r-kind { color: var(--text-2); font-weight: 500; font-size: var(--t-xs); }
.row .r-amt { grid-area: amt; text-align: end; }
.row .r-amt .num { font-weight: 700; font-size: var(--t-lg); letter-spacing: -0.02em; }
.row .r-amt .v-of { display: block; }
.row .tube { grid-area: tube; }
.row .status { grid-area: status; }
.row .r-kind-slot { grid-area: kind; text-align: end; }
@media (min-width: 640px) {
	.row { grid-template-columns: 180px minmax(0, 1fr) 120px; grid-template-areas: "name tube amt" "kind status amt"; align-items: center; }
	.row .r-kind-slot { text-align: start; }
}
.b-side { display: grid; gap: var(--s-5); }

/* ---------- Variant C: Attention first ---------- */
.c-head { margin-block-end: var(--s-6); display: grid; gap: var(--s-2); }
.look { display: grid; gap: var(--s-4); margin-block-end: var(--s-7); }
@media (min-width: 880px) { .look { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.look-card {
	display: grid; grid-template-columns: 88px 1fr; gap: var(--s-4); align-items: stretch;
	background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); padding: var(--s-4);
}
.look-card .jar { height: 100%; min-height: 150px; }
.look-body { display: grid; gap: var(--s-2); align-content: start; }
.look-body h3 { font-size: var(--t-lg); font-weight: 700; letter-spacing: -0.01em; }
.look-body p { margin: 0; color: var(--text-2); font-size: var(--t-sm); max-width: 40ch; }
.look-body .v-left { font-size: var(--t-2xl); }
.look-actions { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-block-start: var(--s-2); }
.chip-btn {
	border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-full);
	padding: 6px 12px; font-size: var(--t-sm); font-weight: 600; cursor: pointer;
}
.chip-btn:hover { background: var(--glass); }
.calm { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1); padding: var(--s-5); color: var(--text-2); margin-block-end: var(--s-7); }
.calm strong { color: var(--text); }
.onpace { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: var(--s-4); margin-block-end: var(--s-7); }
.mini { display: grid; gap: 4px; justify-items: center; text-align: center; }
.mini .jar { width: 44px; height: 72px; border-radius: 12px 12px 16px 16px; }
.mini .v-name { font-size: var(--t-xs); }
.mini .v-of { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- Quick Add sheet ---------- */
.scrim {
	position: fixed; inset: 0; z-index: 40; background: var(--scrim);
	opacity: 0; transition: opacity var(--dur-sheet) var(--ease-out);
}
.sheet {
	position: fixed; z-index: 41; inset-inline: 0; bottom: 0;
	max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
	overflow-y: auto; overscroll-behavior: contain;
	background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
	padding: var(--s-2) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom, 0px));
	box-shadow: var(--shadow-2);
	transform: translateY(100%);
	transition: transform var(--dur-sheet) var(--ease-out);
	display: grid; gap: var(--s-4);
}
.sheet-open .scrim { opacity: 1; }
.sheet-open .sheet { transform: none; }
.grabber { width: 40px; height: 5px; border-radius: var(--r-full); background: var(--line); justify-self: center; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { font-size: var(--t-md); font-weight: 700; }
.amount { text-align: center; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 750; font-size: 3.5rem; line-height: 1; letter-spacing: -0.04em; padding-block: var(--s-2); }
.amount .cents { color: var(--text-2); }
.amount.empty { color: var(--text-2); }
.amount.shake { animation: shake 280ms var(--ease-out); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.key {
	height: 54px; border: 0; border-radius: var(--r-sm); background: var(--surface-sunk); cursor: pointer;
	font-family: var(--font-num); font-size: var(--t-xl); font-weight: 600;
	transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.key:active { transform: scale(0.96); background: var(--line); }
.key svg { width: 24px; height: 24px; vertical-align: middle; }
.field-label { font-size: var(--t-xs); font-weight: 700; color: var(--text-2); margin-block-end: var(--s-2); }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
.pick-btn {
	display: grid; grid-template-columns: 6px 1fr auto; align-items: center; gap: var(--s-2);
	padding: 10px var(--s-3); border-radius: var(--r-sm); cursor: pointer; text-align: start;
	border: 1px solid var(--line); background: var(--surface); min-width: 0;
	transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast);
}
.pick-btn:hover:not(:disabled) { border-color: var(--c); }
.pick-btn:active:not(:disabled) { transform: scale(0.97); }
.pick-btn:disabled { cursor: not-allowed; opacity: 0.5; }
.pick-btn .bar { width: 6px; height: 28px; border-radius: 3px; background: var(--c); }
.pick-btn .pn { font-weight: 650; font-size: var(--t-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-btn .pl { font-size: var(--t-xs); color: var(--text-2); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.for { display: flex; gap: var(--s-2); overflow-x: auto; padding-block-end: 2px; scrollbar-width: none; }
.for-btn {
	flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-full);
	padding: 6px 12px; font-size: var(--t-sm); font-weight: 600; cursor: pointer;
}
.for-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.note-row { display: flex; gap: var(--s-2); }
.note-input {
	flex: 1; min-width: 0; font: inherit; font-size: var(--t-md); color: var(--text);
	background: var(--surface-sunk); border: 1px solid transparent; border-radius: var(--r-sm); padding: 10px var(--s-3);
}
.note-input::placeholder { color: var(--text-2); }
.hint { font-size: var(--t-xs); color: var(--text-2); text-align: center; }
@media (min-width: 880px) {
	.sheet {
		inset: auto; left: 50%; top: 50%; bottom: auto; width: 440px;
		border-radius: var(--r-lg);
		transform: translate(-50%, -46%) scale(0.98); opacity: 0;
		transition: transform var(--dur-sheet) var(--ease-out), opacity var(--dur-base) var(--ease-out);
		padding: var(--s-5);
	}
	.sheet-open .sheet { transform: translate(-50%, -50%); opacity: 1; }
	.grabber { display: none; }
	.key { height: 48px; }
}

/* ---------- Toast ---------- */
.toast {
	position: fixed; z-index: 50; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px));
	transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
	display: flex; align-items: center; gap: var(--s-4);
	background: var(--text); color: var(--bg); border-radius: var(--r-md); padding: 10px 10px 10px var(--s-4);
	box-shadow: var(--shadow-2); font-size: var(--t-sm); font-weight: 600; max-width: calc(100% - 32px); width: max-content;
	transition: transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { border: 0; background: color-mix(in oklab, var(--bg) 16%, transparent); color: var(--bg); padding: 6px 12px; border-radius: var(--r-sm); font-weight: 700; cursor: pointer; }
@media (min-width: 880px) { .toast { bottom: 88px; left: calc(50% + 116px); } }

/* ---------- Prototype bar (not part of the design) ---------- */
.proto {
	position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
	bottom: calc(84px + env(safe-area-inset-bottom, 0px));
	font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #fff;
	background: #000; border-radius: 16px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.35);
	display: grid; gap: 8px; padding: 6px; width: max-content; max-width: calc(100% - 16px);
	outline: 2px dashed #ff3bd4; outline-offset: 2px;
}
@media (min-width: 880px) { .proto { bottom: 16px; left: calc(50% + 116px); } }
.proto-row { display: flex; align-items: center; gap: 6px; }
.proto button, .proto select { font: inherit; color: #fff; background: #222; border: 0; border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.proto button:hover { background: #333; }
.proto .label { padding-inline: 6px; min-width: 150px; text-align: center; font-weight: 600; white-space: nowrap; }
.proto .label small { display: block; font-weight: 400; opacity: 0.7; font-size: 11px; }
.proto-more { display: grid; gap: 8px; padding: 4px 6px 6px; }
.proto-more label { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.proto-more input[type="range"] { flex: 1; accent-color: #ff3bd4; }
.proto-seg { display: flex; gap: 4px; }
.sheet-open .proto { display: none; }
.proto-seg button[aria-pressed="true"] { background: #ff3bd4; color: #000; }
</style>

<div class="app" id="app">
	<aside class="sidebar" aria-label="Main">
		<div class="brand">noodle</div>
		<button class="side-add" type="button" data-open-add>
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
			Quick Add <kbd>Q</kbd>
		</button>
		<nav class="side-nav" id="side-nav"></nav>
		<div class="side-foot">The Rinks · Alex &amp; Sam</div>
	</aside>
	<div class="content">
		<div class="topbar">
			<span class="brand-mobile">noodle</span>
			<div class="month-switch">
				<button class="icon-btn" type="button" data-soon="Other months" aria-label="Previous month">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
				</button>
				<h1>September</h1>
				<button class="icon-btn" type="button" data-soon="Other months" aria-label="Next month">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
				</button>
			</div>
			<div class="parents"><span class="avatars" aria-label="Alex and Sam"><span class="avatar">A</span><span class="avatar">S</span></span></div>
		</div>
		<div id="view"></div>
	</div>
	<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="proto" id="proto" aria-label="Prototype controls"></div>

<script>
(() => {
	// ---------- Fake Household data (in memory) ----------
	const DAYS = 30;
	const MON = "Sep";
	const baseline = 1020000, commitments = 566000, goals = 90000;

	const buckets = [
		{ id: "groceries", name: "Groceries", slot: 1, kind: "Fresh-start", allowance: 110000, rollover: 0, spent: 61200 },
		{ id: "eating", name: "Eating out", slot: 2, kind: "Fresh-start", allowance: 30000, rollover: 0, spent: 11800 },
		{ id: "hockey", name: "Hockey", slot: 3, kind: "Rolling", allowance: 30000, rollover: 8500, spent: 24000 },
		{ id: "life", name: "Life", slot: 4, kind: "Fresh-start", allowance: 40000, rollover: 0, spent: 16000 },
		{ id: "kids", name: "School & kids", slot: 5, kind: "Fresh-start", allowance: 15000, rollover: 0, spent: 4100 },
		{ id: "fun", name: "Fun", slot: 6, kind: "Fresh-start", allowance: 25000, rollover: 0, spent: 26200 },
		{ id: "alex", name: "Alex’s allowance", slot: 7, kind: "Personal", allowance: 10000, rollover: 0, spent: 3500, personal: true },
		{ id: "sam", name: "Sam’s allowance", slot: 8, kind: "Personal", allowance: 10000, rollover: 0, spent: 4800, personal: true, privateToOther: true },
	];
	// Quick Add orders Buckets by likelihood (from recent Quick Adds / time of day).
	const likely = ["groceries", "eating", "hockey", "fun", "life", "kids", "alex"];
	const people = [
		{ id: "all", name: "Everyone" }, { id: "maya", name: "Maya" }, { id: "leo", name: "Leo" },
		{ id: "alex", name: "Alex" }, { id: "sam", name: "Sam" },
	];
	let txns = [
		{ id: 1, merchant: "Costco", bucket: "groceries", for: "all", amount: 18642, day: 13, auto: true },
		{ id: 2, merchant: "Pizza Nova", bucket: "eating", for: "all", amount: 3850, day: 13, note: "after hockey" },
		{ id: 3, merchant: "Pro Hockey Life", bucket: "hockey", for: "leo", amount: 6499, day: 12, auto: true },
		{ id: 4, merchant: "Target", bucket: "life", for: "all", amount: 5217, day: 11, auto: true },
		{ id: 5, merchant: "Regal Cinemas", bucket: "fun", for: "maya", amount: 4100, day: 10 },
		{ id: 6, merchant: "Trader Joe’s", bucket: "groceries", for: "all", amount: 9388, day: 9, auto: true },
	];
	let nextId = 100;

	// ---------- Prototype state ----------
	const variants = [
		{ key: "A", name: "Shelf" },
		{ key: "B", name: "Ledger" },
		{ key: "C", name: "Attention first" },
	];
	const load = (k, d) => { try { return localStorage.getItem("noodle-proto-" + k) ?? d; } catch { return d; } };
	const save = (k, v) => { try { localStorage.setItem("noodle-proto-" + k, v); } catch {} };
	const S = {
		variant: load("variant", "A"),
		day: Number(load("day", "14")),
		theme: load("theme", "system"),
		motion: load("motion", "on"),
		failNext: false,
		protoOpen: false,
		sheet: null,
		freshTxn: null,
	};
	if (!variants.some((v) => v.key === S.variant)) S.variant = "A";

	// ---------- Money + month-state (the real version lives in `domain`) ----------
	const money = (c, cents = false) => {
		const s = (Math.abs(c) / 100).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
		return c < 0 ? "−" + s : s;
	};
	const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
	const byId = (id) => buckets.find((b) => b.id === id);

	function stateOf(b) {
		const avail = b.allowance + b.rollover;
		const left = avail - b.spent;
		const level = Math.max(0, Math.min(1, left / avail));
		const pace = 1 - S.day / DAYS; // share of the Bucket that should be left after today
		const gap = pace * avail - left;
		let status = "on", label = "On Pace";
		if (left < 0) { status = "over"; label = `A little over · ${money(-left)}`; }
		else if (gap > avail * 0.15) { status = "ahead"; label = "Ahead of Pace"; }
		else if (gap > avail * 0.03) { status = "ahead"; label = "A little ahead of Pace"; }
		else if (-gap > avail * 0.12) { label = "Room to spare"; }
		return { avail, left, level, pace, gap, status, label };
	}
	const freeToSpend = () => baseline - commitments - goals - buckets.reduce((s, b) => s + b.allowance, 0);
	const daysLeft = () => DAYS - S.day;
	const lastDay = `${MON}\u00a0${DAYS}`;

	// ---------- Pieces ----------
	const style = (b, st, prev) => `--c: var(--b${b.slot}); --level: ${prev ?? st.level}; --pace-at: ${st.pace};`;
	let prevLevels = {};
	const lvl = (b) => prevLevels[b.id];

	const lock = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
	const ariaFor = (b, st) => `${b.name}: ${money(Math.max(st.left, 0))} left of ${money(st.avail)}. ${st.label}.`;

	const jar = (b, st) => `
		<div class="jar" aria-hidden="true">
			<div class="liquid"></div><div class="gap"></div><div class="pace-line"></div>
		</div>`;
	const tube = (b, st) => `
		<div class="tube" aria-hidden="true">
			<div class="liquid"></div><div class="gap"></div><div class="pace-line"></div>
		</div>`;
	const statusChip = (st) => `<span class="status ${st.status}">${st.label}</span>`;
	const leftText = (st) => st.left < 0 ? money(0) : money(st.left);

	function txnList(limit = 6) {
		return `<ul class="txns">${txns.slice(0, limit).map((t) => {
			const b = byId(t.bucket);
			const who = people.find((p) => p.id === t.for)?.name ?? "Everyone";
			return `<li class="txn ${t.id === S.freshTxn ? "fresh" : ""}" style="--c: var(--b${b.slot})">
				<span class="dot" aria-hidden="true"></span>
				<div class="txn-main">
					<div class="txn-merchant">${esc(t.merchant)}</div>
					<div class="txn-meta">${esc(b.name)} · For ${esc(who)} · ${MON} ${t.day}${t.auto ? ` · <span class="auto" title="Filed automatically. Tap to change.">Auto</span>` : ""}</div>
				</div>
				<span class="txn-amt">${money(t.amount, true)}</span>
			</li>`;
		}).join("")}</ul>`;
	}

	function planCard() {
		const bucketsTotal = buckets.reduce((s, b) => s + b.allowance, 0);
		return `<div class="plan-card">
			<div class="plan-row"><span>Baseline</span><span class="num">${money(baseline)}</span></div>
			<div class="plan-row"><span>Commitments</span><span class="num">−${money(commitments)}</span></div>
			<div class="plan-row"><span>Buckets</span><span class="num">−${money(bucketsTotal)}</span></div>
			<div class="plan-row"><span>Goals</span><span class="num">−${money(goals)}</span></div>
			<div class="plan-row total"><span>Free to Spend</span><span class="num">${money(freeToSpend())}</span></div>
		</div>`;
	}

	const sentence = () => `<p class="sentence">You have <span class="num">${money(freeToSpend())}</span> free until ${lastDay}.</p>`;
	const bucketsLeft = () => buckets.reduce((s, b) => s + Math.max(0, stateOf(b).left), 0);
	const legend = `<span class="legend"><i></i>Pace: where each Bucket should be today</span>`;

	// ---------- Variant A: Shelf — every Bucket as a tall vessel, side by side ----------
	function VariantA() {
		return `
		<div class="shelf-head">
			<div>${sentence()}<p class="sub">Buckets have ${money(bucketsLeft())} left with ${daysLeft()} days to go.</p></div>
			${legend}
		</div>
		<div class="shelf">${buckets.map((b) => {
			const st = stateOf(b);
			return `<article class="vessel ${st.status === "over" ? "is-over" : ""}" data-bid="${b.id}" style="${style(b, st, lvl(b))}" aria-label="${esc(ariaFor(b, st))}">
				${jar(b, st)}
				<div class="v-name">${esc(b.name)}</div>
				<div class="v-left">${leftText(st)}</div>
				<div class="v-of">of ${money(st.avail)}${b.privateToOther ? ` · <span class="private">${lock}Private</span>` : ""}</div>
				${statusChip(st)}
			</article>`;
		}).join("")}</div>
		<div class="a-grid">
			<section><h2 class="section-title">Recent</h2>${txnList()}</section>
			<section><h2 class="section-title">This month’s Plan</h2>${planCard()}</section>
		</div>`;
	}

	// ---------- Variant B: Ledger — one dense row per Bucket with a horizontal tube ----------
	function VariantB() {
		return `
		<div class="b-grid">
			<div>
				<div class="b-hero">
					<span class="big">${money(freeToSpend())}</span>
					<span class="caption">free to spend until ${lastDay} · ${daysLeft()} days to go</span>
				</div>
				<div style="margin-block-end: var(--s-3)">${legend}</div>
				<ul class="ledger">${buckets.map((b) => {
					const st = stateOf(b);
					return `<li class="row ${st.status === "over" ? "is-over" : ""}" data-bid="${b.id}" style="${style(b, st, lvl(b))}" aria-label="${esc(ariaFor(b, st))}">
						<div class="r-name"><span class="sw" aria-hidden="true"></span><span>${esc(b.name)}</span></div>
						${tube(b, st)}
						<div class="r-amt"><span class="num">${leftText(st)}</span><span class="v-of">of ${money(st.avail)}</span></div>
						<div class="r-kind-slot r-kind">${b.kind}${b.rollover ? ` · +${money(b.rollover)} rolled over` : ""}${b.privateToOther ? " · Private" : ""}</div>
						${statusChip(st)}
					</li>`;
				}).join("")}</ul>
			</div>
			<aside class="b-side">
				<section><h2 class="section-title">This month’s Plan</h2>${planCard()}</section>
				<section><h2 class="section-title">Recent</h2>${txnList(5)}</section>
			</aside>
		</div>`;
	}

	// ---------- Variant C: Attention first — only the Buckets that need you get space ----------
	function VariantC() {
		const withState = buckets.map((b) => ({ b, st: stateOf(b) }));
		const look = withState.filter(({ st }) => st.status !== "on").sort((x, y) => (y.st.gap / y.st.avail) - (x.st.gap / x.st.avail));
		const fine = withState.filter(({ st }) => st.status === "on");
		const runOut = (b, st) => {
			const perDay = b.spent / Math.max(S.day, 1);
			const d = perDay > 0 ? Math.floor(S.day + st.left / perDay) : DAYS;
			return d < DAYS ? `At this rate it runs out around ${MON} ${Math.max(d, S.day)}.` : "";
		};
		return `
		<div class="c-head">
			${sentence()}
			<p class="sub">${look.length === 0 ? "Every Bucket is on Pace." : `${look.length === 1 ? "One Bucket is" : `${look.length} Buckets are`} worth a look. Everything else is on Pace.`}</p>
		</div>
		${look.length ? `<h2 class="section-title">Worth a look</h2>
		<div class="look">${look.map(({ b, st }) => `
			<article class="look-card vessel ${st.status === "over" ? "is-over" : ""}" data-bid="${b.id}" style="${style(b, st, lvl(b))}" aria-label="${esc(ariaFor(b, st))}">
				${jar(b, st)}
				<div class="look-body">
					<h3>${esc(b.name)}</h3>
					<div><span class="v-left">${leftText(st)}</span> <span class="v-of">left of ${money(st.avail)}</span></div>
					${statusChip(st)}
					<p>${st.status === "over"
						? `${esc(b.name)} went ${money(-st.left)} over. Cover it from another Bucket or Free to Spend.`
						: `${money(st.gap)} more spent than Pace expects by ${MON} ${S.day}. ${runOut(b, st)}`}</p>
					<div class="look-actions">
						${st.status === "over" ? `<button class="chip-btn" type="button" data-soon="Cover">Cover ${money(-st.left)}</button>` : ""}
						<button class="chip-btn" type="button" data-soon="Bucket detail">See what drove it</button>
					</div>
				</div>
			</article>`).join("")}</div>` : `<div class="calm"><strong>Nothing needs you right now.</strong> Every Bucket is on Pace for ${MON} ${S.day}.</div>`}
		<h2 class="section-title">On Pace</h2>
		<div class="onpace">${fine.map(({ b, st }) => `
			<div class="mini vessel" data-bid="${b.id}" style="${style(b, st, lvl(b))}" aria-label="${esc(ariaFor(b, st))}" role="img">
				${jar(b, st)}
				<div class="v-name">${esc(b.name)}</div>
				<div class="v-of">${leftText(st)}</div>
			</div>`).join("")}</div>
		<section><h2 class="section-title">Recent</h2>${txnList(4)}</section>`;
	}

	// ---------- Render ----------
	const view = document.getElementById("view");
	function render() {
		view.innerHTML = { A: VariantA, B: VariantB, C: VariantC }[S.variant]();
		// Rendered at the previous level; move to the new one next frame so the change animates.
		requestAnimationFrame(() => requestAnimationFrame(() => {
			for (const el of view.querySelectorAll("[data-bid]")) {
				el.style.setProperty("--level", stateOf(byId(el.dataset.bid)).level);
			}
		}));
		prevLevels = Object.fromEntries(buckets.map((b) => [b.id, stateOf(b).level]));
		S.freshTxn = null;
		renderProto();
	}

	// ---------- Nav ----------
	const icons = {
		month: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v4M17 3v4"/><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16"/></svg>`,
		list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>`,
		review: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="m9 11 3 3 8-8"/></svg>`,
		goals: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>`,
		explore: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>`,
		more: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`,
		plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
	};
	document.getElementById("side-nav").innerHTML = [
		["This Month", "month", true], ["Transactions", "list"], ["Review", "review", false, 3], ["Goals", "goals"], ["Explore", "explore"],
	].map(([name, icon, current, badge]) => `<button class="side-link" type="button" ${current ? 'aria-current="page"' : `data-soon="${name}"`}>${icons[icon]}${name}${badge ? `<span class="badge">${badge}</span>` : ""}</button>`).join("");
	document.getElementById("tabbar").innerHTML = `
		<button class="tab" type="button" aria-current="page">${icons.month}Month</button>
		<button class="tab" type="button" data-soon="Transactions">${icons.list}Activity</button>
		<button class="tab-add" type="button" data-open-add aria-label="Quick Add">${icons.plus}</button>
		<button class="tab" type="button" data-soon="Review">${icons.review}<span>Review <span class="badge">3</span></span></button>
		<button class="tab" type="button" data-soon="More">${icons.more}More</button>`;

	// ---------- Toast ----------
	const toastEl = document.getElementById("toast");
	let toastTimer;
	function toast(text, action) {
		clearTimeout(toastTimer);
		toastEl.innerHTML = `<span>${esc(text)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ""}`;
		if (action) toastEl.querySelector("button").onclick = () => { hideToast(); action.run(); };
		toastEl.classList.add("show");
		toastTimer = setTimeout(hideToast, action ? 6000 : 2600);
	}
	const hideToast = () => toastEl.classList.remove("show");

	// ---------- Quick Add ----------
	const sheetRoot = document.getElementById("sheet-root");
	let opener = null;

	function openSheet() {
		if (S.sheet) return;
		opener = document.activeElement;
		S.sheet = { amount: "", for: "all", note: "", noteOpen: false };
		sheetRoot.innerHTML = `<div class="scrim" data-close></div>
			<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qa-title" tabindex="-1" id="sheet"></div>`;
		renderSheet();
		requestAnimationFrame(() => requestAnimationFrame(() => {
			document.body.classList.add("sheet-open");
			document.getElementById("sheet").focus();
		}));
	}
	function closeSheet() {
		if (!S.sheet) return;
		S.sheet = null;
		document.body.classList.remove("sheet-open");
		const root = sheetRoot;
		setTimeout(() => { if (!S.sheet) root.innerHTML = ""; }, 360);
		opener?.focus?.();
	}
	const cents = (a) => Math.round(Number(a || "0") * 100);
	function amountHtml(a) {
		if (!a) return `<div class="amount empty num" id="qa-amount">$0</div>`;
		const [w, f] = a.split(".");
		const whole = Number(w || "0").toLocaleString("en-US");
		return `<div class="amount num" id="qa-amount">$${whole}${f !== undefined ? `<span class="cents">.${f}</span>` : ""}</div>`;
	}
	function renderSheet() {
		const sh = S.sheet, el = document.getElementById("sheet");
		if (!sh || !el) return;
		const has = cents(sh.amount) > 0;
		el.innerHTML = `
			<div class="grabber" aria-hidden="true"></div>
			<div class="sheet-head">
				<h2 id="qa-title">Quick Add</h2>
				<button class="icon-btn" type="button" data-close aria-label="Close">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
				</button>
			</div>
			${amountHtml(sh.amount)}
			<div class="keypad" role="group" aria-label="Amount">
				${["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0"].map((k) => `<button class="key" type="button" data-key="${k}">${k}</button>`).join("")}
				<button class="key" type="button" data-key="back" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m17 9-6 6M11 9l6 6"/></svg></button>
			</div>
			<div>
				<div class="field-label">For</div>
				<div class="for" role="group" aria-label="For">${people.map((p) => `<button class="for-btn" type="button" data-for="${p.id}" aria-pressed="${sh.for === p.id}">${p.name}</button>`).join("")}</div>
			</div>
			${sh.noteOpen
				? `<div class="note-row"><input class="note-input" id="qa-note" placeholder="Note (optional)" value="${esc(sh.note)}" maxlength="80" autocomplete="off"></div>`
				: `<button class="chip-btn" type="button" data-note style="justify-self: start">Add a note</button>`}
			<div>
				<div class="field-label">Tap a Bucket to add</div>
				<div class="pick">${likely.map((id) => {
					const b = byId(id), st = stateOf(b);
					return `<button class="pick-btn" type="button" data-pick="${id}" style="--c: var(--b${b.slot})" ${has ? "" : "disabled"}>
						<span class="bar" aria-hidden="true"></span><span class="pn">${esc(b.name)}</span><span class="pl">${leftText(st)}</span>
					</button>`;
				}).join("")}</div>
				${has ? "" : `<p class="hint">Type an amount first.</p>`}
			</div>`;
	}
	function pressKey(k) {
		const sh = S.sheet;
		let a = sh.amount;
		if (k === "back") a = a.slice(0, -1);
		else if (k === ".") { if (!a.includes(".")) a = (a || "0") + "."; }
		else {
			const [w, f] = a.split(".");
			if (f !== undefined && f.length >= 2) return shake();
			if (f === undefined && (w || "").length >= 5) return shake();
			a = a === "0" ? k : a + k;
		}
		const was = cents(sh.amount) > 0;
		sh.amount = a;
		if (was !== cents(a) > 0) renderSheet();
		else document.getElementById("qa-amount").outerHTML = amountHtml(a);
	}
	function shake() {
		const el = document.getElementById("qa-amount");
		el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
	}
	function commit(bucketId) {
		const sh = S.sheet;
		const amount = cents(sh.amount);
		if (!amount) return;
		const note = document.getElementById("qa-note")?.value.trim() || "";
		const b = byId(bucketId);
		const t = { id: nextId++, merchant: note || "Quick Add", bucket: bucketId, for: sh.for, amount, day: S.day };
		const fail = S.failNext;
		S.failNext = false;
		closeSheet();
		// Optimistic: the level drops now.
		const apply = () => { b.spent += amount; txns = [t, ...txns]; S.freshTxn = t.id; render(); };
		const undo = () => { b.spent -= amount; txns = txns.filter((x) => x.id !== t.id); render(); };
		setTimeout(() => {
			apply();
			if (fail) {
				setTimeout(() => {
					undo();
					toast(`Couldn’t save ${money(amount, true)} to ${b.name}.`, { label: "Retry", run: () => { apply(); toast(`${money(amount, true)} added to ${b.name}`); } });
				}, 1100);
			} else {
				toast(`${money(amount, true)} added to ${b.name}`, { label: "Undo", run: undo });
			}
		}, 220);
	}

	sheetRoot.addEventListener("click", (e) => {
		const t = e.target.closest("button, [data-close]");
		if (!t) return;
		if (t.matches("[data-close]")) return closeSheet();
		if (t.dataset.key) return pressKey(t.dataset.key);
		if (t.dataset.for) { S.sheet.note = document.getElementById("qa-note")?.value ?? S.sheet.note; S.sheet.for = t.dataset.for; return renderSheet(); }
		if (t.matches("[data-note]")) { S.sheet.noteOpen = true; renderSheet(); return document.getElementById("qa-note").focus(); }
		if (t.dataset.pick) return commit(t.dataset.pick);
	});
	// Swipe the sheet down to close (phone).
	let dragY = null;
	sheetRoot.addEventListener("touchstart", (e) => { const s = e.target.closest(".sheet"); if (s && s.scrollTop <= 0) dragY = e.touches[0].clientY; }, { passive: true });
	sheetRoot.addEventListener("touchmove", (e) => {
		if (dragY === null) return;
		const dy = e.touches[0].clientY - dragY, s = document.getElementById("sheet");
		if (dy > 0 && s) { s.style.transition = "none"; s.style.transform = `translateY(${dy}px)`; }
	}, { passive: true });
	sheetRoot.addEventListener("touchend", (e) => {
		if (dragY === null) return;
		const dy = e.changedTouches[0].clientY - dragY, s = document.getElementById("sheet");
		dragY = null;
		if (!s) return;
		s.style.transition = ""; s.style.transform = "";
		if (dy > 90) closeSheet();
	});

	// ---------- Global handlers ----------
	document.addEventListener("click", (e) => {
		const t = e.target.closest("[data-open-add], [data-soon]");
		if (!t) return;
		if (t.matches("[data-open-add]")) return openSheet();
		toast(`${t.dataset.soon} isn’t part of this prototype`);
	});
	document.addEventListener("keydown", (e) => {
		const typing = e.target.closest?.("input, textarea, [contenteditable]");
		if (S.sheet) {
			if (e.key === "Escape") { e.preventDefault(); return closeSheet(); }
			if (typing) return;
			if (/^[0-9.]$/.test(e.key)) { e.preventDefault(); return pressKey(e.key); }
			if (e.key === "Backspace") { e.preventDefault(); return pressKey("back"); }
			return;
		}
		if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
		if (e.key === "q" || e.key === "Q") { e.preventDefault(); return openSheet(); }
		if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
			const i = variants.findIndex((v) => v.key === S.variant);
			setVariant(variants[(i + (e.key === "ArrowRight" ? 1 : variants.length - 1)) % variants.length].key);
		}
	});

	// ---------- Prototype bar ----------
	const protoEl = document.getElementById("proto");
	function setVariant(k) { S.variant = k; save("variant", k); render(); }
	function applyTheme() {
		if (S.theme === "system") document.documentElement.removeAttribute("data-theme");
		else document.documentElement.setAttribute("data-theme", S.theme);
		document.documentElement.classList.toggle("reduce-motion", S.motion === "reduced");
	}
	function renderProto() {
		const v = variants.find((x) => x.key === S.variant);
		protoEl.innerHTML = `
			<div class="proto-row">
				<button type="button" data-p="prev" aria-label="Previous variant">←</button>
				<span class="label">${v.key} — ${v.name}<small>Prototype · ${MON} ${S.day}</small></span>
				<button type="button" data-p="next" aria-label="Next variant">→</button>
				<button type="button" data-p="more" aria-expanded="${S.protoOpen}" aria-label="Prototype settings">${S.protoOpen ? "×" : "⚙"}</button>
			</div>
			${S.protoOpen ? `<div class="proto-more">
				<label>Day <input type="range" id="p-day" min="1" max="${DAYS}" value="${S.day}"> <span>${MON} ${S.day}</span></label>
				<label>Theme <span class="proto-seg">${["system", "light", "dark"].map((t) => `<button type="button" data-theme-set="${t}" aria-pressed="${S.theme === t}">${t}</button>`).join("")}</span></label>
				<label>Motion <span class="proto-seg">${["on", "reduced"].map((m) => `<button type="button" data-motion-set="${m}" aria-pressed="${S.motion === m}">${m}</button>`).join("")}</span></label>
				<label>Next save <span class="proto-seg"><button type="button" data-p="fail" aria-pressed="${S.failNext}">${S.failNext ? "will fail" : "succeeds"}</button></span></label>
			</div>` : ""}`;
	}
	protoEl.addEventListener("click", (e) => {
		const t = e.target.closest("button");
		if (!t) return;
		const i = variants.findIndex((v) => v.key === S.variant);
		if (t.dataset.p === "prev") setVariant(variants[(i + variants.length - 1) % variants.length].key);
		else if (t.dataset.p === "next") setVariant(variants[(i + 1) % variants.length].key);
		else if (t.dataset.p === "more") { S.protoOpen = !S.protoOpen; renderProto(); }
		else if (t.dataset.p === "fail") { S.failNext = !S.failNext; renderProto(); }
		else if (t.dataset.themeSet) { S.theme = t.dataset.themeSet; save("theme", S.theme); applyTheme(); renderProto(); }
		else if (t.dataset.motionSet) { S.motion = t.dataset.motionSet; save("motion", S.motion); applyTheme(); renderProto(); }
	});
	protoEl.addEventListener("input", (e) => {
		if (e.target.id !== "p-day") return;
		S.day = Number(e.target.value);
		save("day", String(S.day));
		// Update in place so the slider keeps focus while dragging.
		view.innerHTML = { A: VariantA, B: VariantB, C: VariantC }[S.variant]();
		for (const el of view.querySelectorAll("[data-bid]")) el.style.setProperty("--level", stateOf(byId(el.dataset.bid)).level);
		protoEl.querySelector(".label small").textContent = `Prototype · ${MON} ${S.day}`;
		e.target.nextElementSibling.textContent = `${MON} ${S.day}`;
	});

	applyTheme();
	render();
})();
</script>
