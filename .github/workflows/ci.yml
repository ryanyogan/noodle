name: CI

on:
  push:
    # Screenshot and footage pushes (shots-** and video-** branches) start only the Page shots or
    # Intro video workflow, not the whole suite; q-** branches are for Quick E2E (quick.yml).
    branches-ignore: ["shots-**", "video-**", "q-**"]
    # A change to docs alone doesn't need the app tested.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  # WebKit as an iPhone 15 runs on every push (the Parents use the app in Safari on an iPhone, and
  # a Safari-only break went unseen while this ran only on request). The iPhone SE job still runs
  # only when asked for from the Actions tab.
  workflow_dispatch:
    inputs:
      webkit:
        description: Also run the WebKit iPhone SE job
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main mid-deploy; other branches only need their newest push tested.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides what this run tests:
  # - tested: this exact commit already passed CI on another branch (the wizard-53 run before
  #   main), so main skips E2E and goes straight to deploy;
  # - phone: the phone jobs, each a project, its shard and its pool of reused test Parents
  #   (e2e/parents.ts). Chromium as an iPhone 15 on two runners (pools s1 and s2, shared with the
  #   desktop shards of the same number) and WebKit as an iPhone 15 on three (wk1 to wk3, its own
  #   18 Parents) on every push; WebKit as an iPhone SE on one (se1, 6 Parents) only when asked
  #   for from the Actions tab.
  gate:
    runs-on: ubuntu-latest
    # Reading earlier runs needs actions: read; the default token can't (403).
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.plan.outputs.tested }}
      phone: ${{ steps.plan.outputs.phone }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            count=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .head_branch != "main")] | length')
            [ "$count" -gt 0 ] && tested=true
          fi
          job() { printf '{"project":"%s","shard":%s,"of":%s,"pool":"%s"}' "$1" "$2" "$3" "$4$2"; }
          phone="$(job chromium-mobile 1 2 s),$(job chromium-mobile 2 2 s)"
          phone="$phone,$(job webkit-iphone 1 3 wk),$(job webkit-iphone 2 3 wk),$(job webkit-iphone 3 3 wk)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.webkit }}" = "true" ]; then
            phone="$phone,$(job webkit-iphone-se 1 1 se)"
          fi
          phone="[$phone]"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          echo "Already passed on another branch: $tested; phone projects: $phone"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The production build (no AI_MODEL) must leave out E2E's dev-only routes (/api/dev/household,
      # /api/dev/outbox, …): they're behind __AI_STUB__, so the bundler drops them.
      - name: Production build has no dev-only routes
        working-directory: apps/web
        run: |
          bun run build
          if grep -rl "/api/dev/" dist; then echo "Dev-only routes are in the production build"; exit 1; fi

  e2e:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # Six runners at once, three workers each, against the built Worker (E2E_SERVER=build, #81):
    # the dev server compiled pages on demand and starved a second worker, so it took six runners of
    # one worker each. Specs seed the local D1 through the Worker (/api/dev/sql); when they opened
    # its SQLite file from a second process, three workers got SQLITE_BUSY.
    # Measured and left out: caching bun's packages (install takes 2 s, saving the cache 26 s) and
    # building once in a job of its own (the build takes 8 s; a job before the shards costs more).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Playwright's image already has Chromium, WebKit and their system libraries, so no job installs
    # them. Keep its tag equal to @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
      E2E_SERVER: build
      # Names this runner's pool of reused test Parents (e2e/parents.ts, #108).
      E2E_POOL: s${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      # setup-bun needs unzip, which the image lacks; npm's bun package is the same binary.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      # The browsers are cached by Playwright version; only their system libraries install each run.
      - name: Write dev keys for the local Worker
        working-directory: apps/web
        run: |
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\n' \
            "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" "${{ secrets.CLERK_SECRET_KEY }}" > .dev.vars
          # Throwaway VAPID keys for Nudges; nothing is really pushed in E2E.
          bun scripts/vapid-keys.ts >> .dev.vars
      # Built once, with the stub AI and E2E's dev-only routes; vite preview serves it (and copies
      # .dev.vars in, so the keys must be written first).
      - run: bun run build
        working-directory: apps/web
        env:
          AI_MODEL: stub
      # Phone tests run in e2e-phone. On main a commit that breaks everything stops after five
      # failures instead of running each test to its timeout, twice; other branches (ci-*) run
      # every test, so one run reports all that is broken.
      - run: bun run e2e --project=chromium --shard=${{ matrix.shard }}/6 --workers=3 ${{ github.ref == 'refs/heads/main' && '--max-failures=5' || '' }}
        working-directory: apps/web
      - name: Slowest 20 tests
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("playwright-report/report.json")) process.exit(0);
            const report = JSON.parse(fs.readFileSync("playwright-report/report.json", "utf8"));
            const rows = [];
            const steps = {};
            const walk = (suite) => {
              for (const spec of suite.specs ?? [])
                for (const test of spec.tests ?? [])
                  for (const [attempt, result] of (test.results ?? []).entries())
                  {
                    rows.push({ ms: result.duration, status: result.status, attempt, name: `${spec.file}:${spec.line} ${spec.title}` });
                    for (const out of result.stdout ?? [])
                      for (const [, label, ms] of (out.text ?? "").matchAll(/TIMING (\S+) (\d+)/g)) {
                        steps[label] ??= { count: 0, ms: 0 };
                        steps[label].count += 1;
                        steps[label].ms += Number(ms);
                      }
                  }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            rows.sort((a, b) => b.ms - a.ms);
            const total = rows.reduce((sum, row) => sum + row.ms, 0);
            const lines = [
              `### Slowest 20 of ${rows.length} test runs (${(total / 1000).toFixed(0)} s of test time, ${(report.stats.duration / 1000).toFixed(0)} s wall)`,
              "",
              "| Seconds | Result | Test |",
              "|---:|---|---|",
              ...rows.slice(0, 20).map((row) => `| ${(row.ms / 1000).toFixed(1)} | ${row.status}${row.attempt ? " (retry)" : ""} | ${row.name.replaceAll("|", "/")} |`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            // The same in the log, where `gh run view --log` can read it (40 rows: grep SLOW).
            console.log(`SLOWSUM ${rows.length} runs, ${(total / 1000).toFixed(0)} s of test time, ${(report.stats.duration / 1000).toFixed(0)} s wall`);
            for (const [label, step] of Object.entries(steps)) console.log(`STEP ${label} ${step.count} times, ${(step.ms / 1000).toFixed(0)} s, ${(step.ms / step.count).toFixed(0)} ms each`);
            for (const row of rows.slice(0, 40)) console.log(`SLOW ${(row.ms / 1000).toFixed(1)} ${row.status}${row.attempt ? "(retry)" : ""} ${row.name}`);
          '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results

  # The phone tests (phone-*.spec.ts, sheet-phone.spec.ts and tests tagged @phone): one runner for
  # each job the gate listed.
  e2e-phone:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    name: e2e-phone (${{ matrix.project }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.phone) }}
    # Playwright's image already has Chromium, WebKit and their system libraries, so no job installs
    # them. Keep its tag equal to @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
      E2E_SERVER: build
      # Names this runner's pool of reused test Parents (e2e/parents.ts, #108): the gate chose it.
      E2E_POOL: ${{ matrix.pool }}
    steps:
      - uses: actions/checkout@v5
      # setup-bun needs unzip, which the image lacks; npm's bun package is the same binary.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - name: Write dev keys for the local Worker
        working-directory: apps/web
        run: |
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\n' \
            "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" "${{ secrets.CLERK_SECRET_KEY }}" > .dev.vars
          bun scripts/vapid-keys.ts >> .dev.vars
      - run: bun run build
        working-directory: apps/web
        env:
          AI_MODEL: stub
      # On main a failure that hits every test (sign-in, say) stops after three instead of letting
      # each test run to its timeout, twice; other branches run every test.
      - run: bun run e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.of }} --workers=3 ${{ github.ref == 'refs/heads/main' && '--max-failures=3' || '' }}
        working-directory: apps/web
      - name: Slowest 20 tests
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("playwright-report/report.json")) process.exit(0);
            const report = JSON.parse(fs.readFileSync("playwright-report/report.json", "utf8"));
            const rows = [];
            const steps = {};
            const walk = (suite) => {
              for (const spec of suite.specs ?? [])
                for (const test of spec.tests ?? [])
                  for (const [attempt, result] of (test.results ?? []).entries())
                  {
                    rows.push({ ms: result.duration, status: result.status, attempt, name: `${spec.file}:${spec.line} ${spec.title}` });
                    for (const out of result.stdout ?? [])
                      for (const [, label, ms] of (out.text ?? "").matchAll(/TIMING (\S+) (\d+)/g)) {
                        steps[label] ??= { count: 0, ms: 0 };
                        steps[label].count += 1;
                        steps[label].ms += Number(ms);
                      }
                  }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of report.suites ?? []) walk(suite);
            rows.sort((a, b) => b.ms - a.ms);
            const total = rows.reduce((sum, row) => sum + row.ms, 0);
            const lines = [
              `### Slowest 20 of ${rows.length} test runs (${(total / 1000).toFixed(0)} s of test time, ${(report.stats.duration / 1000).toFixed(0)} s wall)`,
              "",
              "| Seconds | Result | Test |",
              "|---:|---|---|",
              ...rows.slice(0, 20).map((row) => `| ${(row.ms / 1000).toFixed(1)} | ${row.status}${row.attempt ? " (retry)" : ""} | ${row.name.replaceAll("|", "/")} |`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            // The same in the log, where `gh run view --log` can read it (40 rows: grep SLOW).
            console.log(`SLOWSUM ${rows.length} runs, ${(total / 1000).toFixed(0)} s of test time, ${(report.stats.duration / 1000).toFixed(0)} s wall`);
            for (const [label, step] of Object.entries(steps)) console.log(`STEP ${label} ${step.count} times, ${(step.ms / 1000).toFixed(0)} s, ${(step.ms / step.count).toFixed(0)} ms each`);
            for (const row of rows.slice(0, 40)) console.log(`SLOW ${(row.ms / 1000).toFixed(1)} ${row.status}${row.attempt ? "(retry)" : ""} ${row.name}`);
          '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/web/test-results

  deploy:
    # Runs when the tests passed here, or were skipped because this commit already passed elsewhere.
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.gate.result == 'success' && needs.check.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.e2e.result) &&
      contains(fromJSON('["success","skipped"]'), needs.e2e-phone.result)
    needs: [gate, check, e2e, e2e-phone]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The Time Travel bookmark just before migrating, so a bad migration can be rolled back to
      # exactly here (docs/runbooks/restore.md).
      - name: Record the Time Travel bookmark
        working-directory: apps/web
        run: |
          npx wrangler d1 time-travel info noodle | tee time-travel.txt
          {
            echo "### D1 Time Travel bookmark before migrating"
            echo
            echo '```'
            grep -i "bookmark" time-travel.txt || cat time-travel.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun run db:migrate:remote
        working-directory: apps/web
      - run: bun run deploy
        working-directory: apps/web
