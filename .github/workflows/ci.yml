name: CI

on:
  push:
    # A change to docs alone doesn't need the app tested.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  # The WebKit iPhone jobs run only when asked for from the Actions tab (no nightly run: it cost
  # about 30 runner minutes a night whether anything changed or not).
  workflow_dispatch:
    inputs:
      webkit:
        description: Also run the WebKit iPhone jobs
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main mid-deploy; other branches only need their newest push tested.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides what this run tests:
  # - tested: this exact commit already passed CI on another branch (the wizard-53 run before
  #   main), so main skips E2E and goes straight to deploy;
  # - phone: which phone projects run. Chromium as an iPhone 15 on every push; WebKit as iPhone 15
  #   and SE only when asked for from the Actions tab.
  gate:
    runs-on: ubuntu-latest
    # Reading earlier runs needs actions: read; the default token can't (403).
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.plan.outputs.tested }}
      phone: ${{ steps.plan.outputs.phone }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            count=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .head_branch != "main")] | length')
            [ "$count" -gt 0 ] && tested=true
          fi
          case "${{ github.event_name }}" in
            workflow_dispatch)
              if [ "${{ inputs.webkit }}" = "true" ]; then
                phone='["chromium-mobile","webkit-iphone","webkit-iphone-se"]'
              else
                phone='["chromium-mobile"]'
              fi ;;
            *) phone='["chromium-mobile"]' ;;
          esac
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          echo "Already passed on another branch: $tested; phone projects: $phone"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The production build (no AI_MODEL) must leave out E2E's dev-only routes (/api/dev/household,
      # /api/dev/outbox, …): they're behind __AI_STUB__, so the bundler drops them.
      - name: Production build has no dev-only routes
        working-directory: apps/web
        run: |
          bun run build
          if grep -rl "/api/dev/" dist; then echo "Dev-only routes are in the production build"; exit 1; fi

  e2e:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # Three runners at once, three workers each, against the built Worker (E2E_SERVER=build, #81):
    # the dev server compiled pages on demand and starved a second worker, so it took six runners of
    # one worker each. Specs seed the local D1 through the Worker (/api/dev/sql); when they opened
    # its SQLite file from a second process, three workers got SQLITE_BUSY.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Playwright's image already has Chromium, WebKit and their system libraries, so no job installs
    # them. Keep its tag equal to @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
      E2E_SERVER: build
    steps:
      - uses: actions/checkout@v5
      # setup-bun needs unzip, which the image lacks; npm's bun package is the same binary.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      # The browsers are cached by Playwright version; only their system libraries install each run.
      - name: Write dev keys for the local Worker
        working-directory: apps/web
        run: |
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\n' \
            "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" "${{ secrets.CLERK_SECRET_KEY }}" > .dev.vars
          # Throwaway VAPID keys for Nudges; nothing is really pushed in E2E.
          bun scripts/vapid-keys.ts >> .dev.vars
      # Built once, with the stub AI and E2E's dev-only routes; vite preview serves it (and copies
      # .dev.vars in, so the keys must be written first).
      - run: bun run build
        working-directory: apps/web
        env:
          AI_MODEL: stub
      # Phone tests run in e2e-phone.
      - run: bun run e2e --project=chromium --shard=${{ matrix.shard }}/3 --workers=3
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results

  # The phone tests (phone-*.spec.ts, sheet-phone.spec.ts and tests tagged @phone), once per phone
  # project the gate chose.
  e2e-phone:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.gate.outputs.phone) }}
    # Playwright's image already has Chromium, WebKit and their system libraries, so no job installs
    # them. Keep its tag equal to @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
      E2E_SERVER: build
    steps:
      - uses: actions/checkout@v5
      # setup-bun needs unzip, which the image lacks; npm's bun package is the same binary.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - name: Write dev keys for the local Worker
        working-directory: apps/web
        run: |
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\n' \
            "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" "${{ secrets.CLERK_SECRET_KEY }}" > .dev.vars
          bun scripts/vapid-keys.ts >> .dev.vars
      - run: bun run build
        working-directory: apps/web
        env:
          AI_MODEL: stub
      # A failure that hits every test (sign-in, say) stops after three instead of letting each
      # test run to its timeout, twice.
      - run: bun run e2e --project=${{ matrix.project }} --max-failures=3 --workers=3
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}
          path: apps/web/test-results

  deploy:
    # Runs when the tests passed here, or were skipped because this commit already passed elsewhere.
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.gate.result == 'success' && needs.check.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.e2e.result) &&
      contains(fromJSON('["success","skipped"]'), needs.e2e-phone.result)
    needs: [gate, check, e2e, e2e-phone]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The Time Travel bookmark just before migrating, so a bad migration can be rolled back to
      # exactly here (docs/runbooks/restore.md).
      - name: Record the Time Travel bookmark
        working-directory: apps/web
        run: |
          npx wrangler d1 time-travel info noodle | tee time-travel.txt
          {
            echo "### D1 Time Travel bookmark before migrating"
            echo
            echo '```'
            grep -i "bookmark" time-travel.txt || cat time-travel.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun run db:migrate:remote
        working-directory: apps/web
      - run: bun run deploy
        working-directory: apps/web
