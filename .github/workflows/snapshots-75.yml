# TEMPORARY (#75, phase 75e): redraws the screenshot baselines in Soft stone on CI's own image.
# Playwright's per-pixel threshold hides a palette shift, so the specs pass against the old images
# and CI never produces "actual" files (ADR-0034 rule 6). Removed again once the baselines are in.
name: snapshots-75
on:
  push:
    branches: [ci-75]
jobs:
  redraw:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - name: Write dev keys for the local Worker
        working-directory: apps/web
        run: |
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\n' \
            "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" "${{ secrets.CLERK_SECRET_KEY }}" > .dev.vars
          bun scripts/vapid-keys.ts >> .dev.vars
      - run: bun run e2e --project=chromium --project=chromium-mobile --update-snapshots=all e2e/auth-shots.spec.ts e2e/setup-shots.spec.ts e2e/quick-add-many.spec.ts e2e/shell.spec.ts
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-soft-stone
          path: apps/web/e2e/*-snapshots
