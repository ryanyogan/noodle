name: Redraw snapshots (temporary, #83)

# One-off: redraws the screenshot specs' comparison pictures in CI's own container and uploads them.
# Deleted in the commit that brings the pictures in.

on:
  push:
    branches: ["shots-83c"]
  workflow_dispatch:

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
      E2E_SERVER: build
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - name: Write dev keys for the local Worker
        working-directory: apps/web
        run: |
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\n' \
            "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" "${{ secrets.CLERK_SECRET_KEY }}" > .dev.vars
          bun scripts/vapid-keys.ts >> .dev.vars
      - run: bun run build
        working-directory: apps/web
        env:
          AI_MODEL: stub
      - run: >-
          bun run e2e e2e/auth-shots.spec.ts e2e/setup-shots.spec.ts e2e/quick-add-many.spec.ts e2e/shell.spec.ts
          --project=chromium --project=chromium-mobile --update-snapshots=all --workers=3
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: snapshots
          path: apps/web/e2e/*-snapshots
