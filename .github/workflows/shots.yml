name: Page shots

# Pictures of every page with one realistic Household (apps/web/e2e/page-shots.spec.ts), for looking
# at a redesign from a machine that can't run a browser. Push a branch named shots-<anything>, or
# run it from the Actions tab. Each width is a job of its own with its own Household (about ten
# minutes side by side, where one job took over 45), and uploads a "page-shots-<width>" artifact:
#
#   git push origin HEAD:shots-<id>
#   gh run list --workflow=shots.yml --branch=shots-<id> --limit 1
#   gh run watch <run id> -i 60 --exit-status
#   gh run download <run id> --name page-shots-1440 --dir <somewhere>
#
# The PNGs land at <somewhere>/<width>/<nn-name>.png, beside seed-notes.txt.
#
# Dark pictures: run it by hand with theme=dark; the artifact is then "page-shots-<width>-dark":
#
#   gh workflow run shots.yml --ref shots-<id> -f widths=1440 -f theme=dark
#   gh run download <run id> --name page-shots-1440-dark --dir <somewhere>
#
# WebKit (the engine in Safari on an iPhone), phone widths only; the artifact is "page-shots-<width>-webkit":
#
#   gh workflow run shots.yml --ref q-<id> -f widths=393 -f project=webkit-shots

on:
  push:
    branches: ["shots-**"]
  workflow_dispatch:
    inputs:
      widths:
        description: "Widths, comma-separated (empty: 1024,1440,1920,393,320)"
        type: string
        default: ""
      theme:
        description: Theme
        type: choice
        options: [light, dark]
        default: light
      project:
        description: "Browser: chromium, or webkit-shots (WebKit as an iPhone 15; phone widths only)"
        type: choice
        options: [chromium, webkit-shots]
        default: chromium
      only:
        description: "Only the pictures whose name starts with one of these, comma-separated (empty: all)"
        type: string
        default: ""

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The widths asked for (all five when none are), as the matrix below.
  widths:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          WIDTHS: ${{ inputs.widths }}
        run: |
          echo "list=$(printf '%s' "${WIDTHS:-1024,1440,1920,393,320}" | tr -d ' ' | jq -Rc 'split(",") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  shots:
    needs: widths
    name: shots (${{ matrix.width }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        width: ${{ fromJSON(needs.widths.outputs.list) }}
    # Playwright's image already has Chromium and its system libraries. Keep its tag equal to
    # @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
      E2E_SERVER: build
      PAGE_SHOTS: "1"
      PAGE_SHOTS_WIDTHS: ${{ matrix.width }}
      PAGE_SHOTS_THEME: ${{ inputs.theme || 'light' }}
      PAGE_SHOTS_ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v5
      # setup-bun needs unzip, which the image lacks; npm's bun package is the same binary.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - name: Write dev keys for the local Worker
        working-directory: apps/web
        run: |
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\n' \
            "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" "${{ secrets.CLERK_SECRET_KEY }}" > .dev.vars
          bun scripts/vapid-keys.ts >> .dev.vars
      # Against the built Worker, as CI's E2E (#81): stub AI and the dev-only routes the spec seeds through.
      - run: bun run build
        working-directory: apps/web
        env:
          AI_MODEL: stub
      - run: bun run e2e --project=${{ inputs.project || 'chromium' }} page-shots.spec.ts
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-shots-${{ matrix.width }}${{ inputs.theme == 'dark' && '-dark' || '' }}${{ inputs.project == 'webkit-shots' && '-webkit' || '' }}
          path: apps/web/test-results/page-shots
          if-no-files-found: warn
